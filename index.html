p2.algo.o4","txt":"Choisir ou reconnaître le type d’une variable. Réaliser un calcul à l’aide d’une ou de plusieurs variables.","comp":["ana"]},{"id":"bp2.algo.o5","txt":"Modifier ou compléter un algorithme ou un programme.","comp":["real"]},{"id":"bp2.algo.o6","txt":"Concevoir un algorithme ou un programme simple pour résoudre un problème.","comp":["real"]},{"id":"bp2.algo.o7","txt":"Comprendre et utiliser des fonctions. Compléter la définition d’une fonction. Structurer un programme en ayant recours à des fonctions pour résoudre un problème donné.","comp":["real"]}],"connaissances":[{"id":"bp2.algo.k1","txt":"Séquences d’instructions, instructions conditionnelles, boucles bornées (for) et non bornées (while).","sous":[]},{"id":"bp2.algo.k2","txt":"Types de variables : entiers, flottants, chaînes de caractères, booléens.","sous":[]},{"id":"bp2.algo.k3","txt":"Affectation d’une variable.","sous":[]},{"id":"bp2.algo.k4","txt":"Arguments d’une fonction.","sous":[]},{"id":"bp2.algo.k5","txt":"Valeur(s) renvoyée(s) par une fonction.","sous":[]}],"bo":{"liens":["Au cycle 4, les élèves ont notamment appris à :","− écrire une séquence d’instructions ;","− utiliser simultanément des boucles « répéter ... fois », et « répéter jusqu’à ... » et des instructions conditionnelles permettant de réaliser des figures, des calculs et des déplacements ;","− décomposer un problème en sous-problèmes.","En seconde, les élèves passent progressivement de l’utilisation du langage de programmation visuel qu’ils ont utilisé dans les classes antérieures au langage interprété Python. Ce dernier a été choisi pour sa concision, sa simplicité, son implémentation dans de multiples environnements et son utilisation dans l’enseignement supérieur. On ne vise pas la maîtrise d’un langage de programmation ni une virtuosité technique ; la programmation est un outil au service de la formation des élèves à la pensée algorithmique.","L’accent est mis sur la programmation modulaire qui consiste à découper une tâche complexe en tâches plus simples. Pour ce faire, les élèves utilisent des fonctions informatiques."],"commentaires":["− Les notions abordées dans ce module ne font pas l’objet d’un cours spécifique et sont","travaillées en situation.","− Aucune maîtrise n’est attendue pour les propriétés des différents types de variables.","− Pour les fonctions en Python, on donne aux élèves l’entête de la fonction (nom et","arguments)."]}}],"automatismes":[{"id":"bp2.a1","txt":"Calcul d’une fréquence.","groupe":"Tous"},{"id":"bp2.a2","txt":"Utilisation des pourcentages.","groupe":"Tous"},{"id":"bp2.a3","txt":"Expression d’un nombre donné en écriture décimale ou fractionnaire sous forme d’un pourcentage et réciproquement.","groupe":"Tous"},{"id":"bp2.a4","txt":"Calcul d’une moyenne.","groupe":"Tous"},{"id":"bp2.a5","txt":"Calculs avec les puissances de 10.","groupe":"Tous"},{"id":"bp2.a6","txt":"Écriture d’un nombre en notation scientifique.","groupe":"Tous"},{"id":"bp2.a7","txt":"Comparaison des fractions simples entre elles ou avec des nombres décimaux.","groupe":"Tous"},{"id":"bp2.a8","txt":"Additions de fractions, multiplication de fractions.","groupe":"Tous"},{"id":"bp2.a9","txt":"Développement, factorisation, réduction d’expressions littérales.","groupe":"Tous"},{"id":"bp2.a10","txt":"Transformation de formules (par exemple U = RI, d = vt…), expression d’une variable en fonction des autres.","groupe":"Tous"},{"id":"bp2.a11","txt":"Résolutions d’équations du type ax = b et a + x = b, avec a et b entiers relatifs.","groupe":"Tous"},{"id":"bp2.a12","txt":"Utilisation des différentes procédures de calcul d’une quatrième proportionnelle.","groupe":"Tous"},{"id":"bp2.a13","txt":"Application et calcul d’un pourcentage ou d’une échelle.","groupe":"Tous"},{"id":"bp2.a14","txt":"Repérage dans un plan rapporté à un repère orthogonal.","groupe":"Tous"},{"id":"bp2.a15","txt":"Recherche d’image et d’antécédents d’un nombre par une fonction.","groupe":"Tous"},{"id":"bp2.a16","txt":"Utilisation des procédures de résolution graphique d’équations.","groupe":"Tous"},{"id":"bp2.a17","txt":"Conversions d’unités de longueur, d’aire et de volume.","groupe":"Tous"},{"id":"bp2.a18","txt":"Reconnaissance des configurations de Pythagore et de Thalès.","groupe":"Tous"},{"id":"bp2.a19","txt":"Détermination d’un arrondi, d’une valeur approchée.","groupe":"Tous"},{"id":"bp2.a20","txt":"Expression d’un résultat dans une unité adaptée.","groupe":"Tous"},{"id":"bp2.a21","txt":"Vérification de la cohérence grandeur - unité d’une mesure.","groupe":"Tous"},{"id":"bp2.a22","txt":"Calcul de l’aire d’un carré, d’un rectangle, d’un disque.","groupe":"Tous"}],"vocabulaire":["L’apprentissage des notations mathématiques, de la logique et des raisonnements est transversal à tous les chapitres du programme des trois années de formation. Aussi, il importe d’y travailler d’abord dans des contextes où ils se présentent naturellement, puis de prévoir des moments pour effectuer une synthèse de certains concepts ou une explicitation de types de raisonnement, après que ceux-ci ont été rencontrés plusieurs fois en situation.","Les élèves doivent connaître les notions d’élément d’un ensemble, de sous-ensemble, d’appartenance et d’inclusion, de réunion, d’intersection et de complémentaire et savoir utiliser les symboles de base correspondant : ∈, ⊂, ⋂, ⋃ ainsi que la notation des ensembles de nombres et des intervalles du type [a ; b], ]a ; b[, [a ; b[, ]a ; b], avec a et b réels. Ils rencontrent également la notion de couple.","Pour le complémentaire d’un sous-ensemble A de E, on utilise la notation des probabilités Ā","Pour ce qui concerne le raisonnement logique, les élèves rencontrent sur des exemples :","− les connecteurs logiques « et », « ou » ;","− le quantificateur « quel que soit » et le quantificateur « il existe » (les symboles ∀ et ∃","sont hors programme) ;","− des implications et équivalences logiques ;","− la réciproque d’une implication ;","− l’utilisation d’un contre-exemple pour infirmer une proposition universelle ;","− des raisonnements par disjonction des cas, des raisonnements par l’absurde.","Les élèves distinguent les utilisations possibles du symbole « = » (égalité, identité, équation)","et le statut des lettres utilisées (variable, indéterminée, inconnue, paramètre)."]},{"id":"bp1","label":"1re Bac Pro","niveau":"1re pro","voie":"pro","bo":"Programme de mathématiques de la classe de première professionnelle (annexe 1, BO spécial n°1 du 6 février 2020)","competences":"pro","chapitres":[{"id":"bp1.stat2","domaine":"Statistique et probabilités","titre":"Statistique à deux variables quantitatives","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bp1.stat2.o1","txt":"Représenter graphiquement à l’aide d’outils numériques un nuage de points associé à une série statistique à deux variables quantitatives.","comp":["real"]},{"id":"bp1.stat2.o2","txt":"Réaliser un ajustement affine, à l’aide des outils numériques.","comp":["real"]},{"id":"bp1.stat2.o3","txt":"Déterminer l’équation réduite d’une droite d’ajustement par la méthode des moindres carrés, à l’aide d’outils numériques.","comp":["real"]},{"id":"bp1.stat2.o4","txt":"Interpoler ou extrapoler des valeurs inconnues.","comp":["real"]},{"id":"bp1.stat2.o5","txt":"Déterminer le coefficient de détermination d’une série statistique à deux variables quantitatives à l’aide d’outils numériques.","comp":["real"]},{"id":"bp1.stat2.o6","txt":"Évaluer la pertinence d’un ajustement affine.","comp":["ana"]}],"connaissances":[{"id":"bp1.stat2.k1","txt":"Nuage de points associé à une série statistique à deux variables quantitatives.","sous":[]},{"id":"bp1.stat2.k2","txt":"Ajustement affine par la méthode des moindres carrés.","sous":[]},{"id":"bp1.stat2.k3","txt":"Coefficient de détermination R2.","sous":[]}],"bo":{"liens":["En classe de seconde, les élèves ont consolidé les notions d’effectif et de fréquence. Ils ont étudié différents paramètres de dispersion et ont découvert des représentations et indicateurs permettant de comparer des séries statistiques. En classe de première, ils consolident ces notions et étudient les ajustements affines qui permettent de réinvestir les notions de fonction affine et d’équation de droite étudiées en classe de seconde."],"exemples":["− Déterminer des indicateurs de position et de dispersion d’une série statistique en utilisant les listes.","− Déterminer l’équation réduite d’une droite d’ajustement par la méthode des moindres carrés à l’aide d’outils numériques.","− Déterminer le coefficient de détermination d’une série statistique à deux variables quantitatives à l’aide d’outils numériques."],"commentaires":["− On indique aux élèves l’ajustement à réaliser (ajustement de x en y ou de y en x).","− Ce module donne l’occasion de travailler sur la droite de régression et de faire","percevoir le sens de l’expression « moindres carrés ».","− Le coefficient de détermination, carré du coefficient de corrélation, est obtenu à l’aide d’outils numériques.","− Aucune théorie n’est attendue sur ces coefficients ; un coefficient de détermination proche de 1 signifie qu’il existe une forte corrélation entre les deux variables. On montrera, au moins sur un exemple, que cela ne signifie pas nécessairement qu’il y a une relation de causalité entre les deux variables."],"bivalence":["Ce module est mis en œuvre dans les domaines Mécanique et Électricité du programme de physique-chimie."]}},{"id":"bp1.proba","domaine":"Statistique et probabilités","titre":"Probabilités","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bp1.proba.o1","txt":"Calculer la probabilité d’un événement par addition des probabilités d’événements élémentaires.","comp":["real"]},{"id":"bp1.proba.o2","txt":"Calculer la probabilité de: un événement contraire.","comp":["real"]},{"id":"bp1.proba.o3","txt":"Calculer la probabilité de: la réunion d’événements incompatibles.","comp":["real"]},{"id":"bp1.proba.o4","txt":"Compléter ou exploiter des représentations: tableaux croisés d’effectifs, diagrammes.","comp":["real"]},{"id":"bp1.proba.o5","txt":"Calculer la probabilité de la réunion, de l’intersection de deux événements.","comp":["real"]},{"id":"bp1.proba.o6","txt":"Utiliser la relation entre la probabilité de A ⋃ B et de A ⋂ B.","comp":["real"]},{"id":"bp1.proba.o7","txt":"Calculer des fréquences conditionnelles à partir de tableaux croisés d’effectifs.","comp":["real"]},{"id":"bp1.proba.o8","txt":"Déterminer une probabilité conditionnelle.","comp":["real"]}],"connaissances":[{"id":"bp1.proba.k1","txt":"Probabilité d’un événement dans un univers fini","sous":["événements élémentaires équiprobables","événements élémentaires non équiprobables"]},{"id":"bp1.proba.k2","txt":"Événements incompatibles, événements contraires.","sous":[]},{"id":"bp1.proba.k3","txt":"Probabilité de l’événement contraire Ā d’un événement A.","sous":[]},{"id":"bp1.proba.k4","txt":"Réunion et intersection d’événements.","sous":[]},{"id":"bp1.proba.k5","txt":"Probabilité de la réunion, de l’intersection de deux événements.","sous":[]},{"id":"bp1.proba.k6","txt":"P(A ⋃ B) = P(A) + P(B) - P(A ⋂ B)","sous":[]},{"id":"bp1.proba.k7","txt":"Fréquence conditionnelle.","sous":[]},{"id":"bp1.proba.k8","txt":"Probabilité conditionnelle.","sous":[]},{"id":"bp1.proba.k9","txt":"Définition : P (B) = P(A∩B) où A et B sont deux A P(A)","sous":[]},{"id":"bp1.proba.k10","txt":"événements, avec P(A) ≠ 0.","sous":[]}],"bo":{"liens":["En classe de seconde, les élèves ont fait le lien entre fréquences et probabilités ; ils ont constaté le phénomène de stabilisation des fréquences et découvert les arbres de dénombrement. En classe de première, les élèves utilisent le vocabulaire ensembliste pour calculer des probabilités et exploiter des tableaux croisés d’effectifs. Les fréquences conditionnelles, calculées à partir de tableaux croisés d’effectifs, permettent d’introduire les probabilités conditionnelles."],"exemples":["− Estimer P(A ⋃ B) et P(A ⋂ B) à l’aide d’un tableur puis conjecturer la relation","P(A ⋃ B) = P(A) + P(B) - P(A ⋂ B)"],"commentaires":["− On utilise le contenu du module vocabulaire ensembliste et logique, notamment pour traduire en langage probabiliste un événement donné en langage courant et réciproquement.","− La représentation à l’aide d’un arbre de probabilités pondéré et la formule des probabilités totales ne relèvent pas du programme de la classe de première et seront abordées en classe terminale.","− Les probabilités conditionnelles seront introduites avec des situations probabilistes pouvant se ramener à des tableaux d’effectifs ou de fréquences et le lien sera fait avec les fréquences conditionnelles.","Algèbre – Analyse","Ce domaine permet de poursuivre la formation des élèves à la résolution de problèmes, tout en confortant l’acquisition de méthodes déjà étudiées (fonctions et problèmes du premier degré, fonction carré) et en introduisant de nouvelles notions (polynômes de degré 2, suites, dérivées).","Ces notions sont présentées à partir de contextes familiers aux élèves, issus de la vie courante, du domaine professionnel ou en lien avec la physique-chimie. Les situations choisies permettent de traiter des problématiques liées autant que possible aux grands enjeux de société (sociétaux ou environnementaux).","Les objectifs principaux de ce domaine sont de :","− modéliser une situation à l’aide de suites numériques dans le cas d’un phénomène discret ou à l’aide de fonctions dans le cas d’un phénomène continu ;","− découvrir et étudier de nouvelles fonctions ;","− découvrir la dérivation, étudier les variations de fonctions ;","− résoudre des problèmes en choisissant une méthode adaptée.","L’utilisation de tableurs et de logiciels de géométrie dynamique facilite l’introduction des","nouvelles notions abordées dans les différents modules."]}},{"id":"bp1.suites","domaine":"Algèbre – Analyse","titre":"Suites numériques","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bp1.suites.o1","txt":"Générer par le calcul ou à l’aide d’un outil numérique, les termes de différentes suites.","comp":["real"]},{"id":"bp1.suites.o2","txt":"Étudier le sens de variation d’une suite donnée par un = ƒ(n) dans des cas simples.","comp":["ana"]},{"id":"bp1.suites.o3","txt":"Calculer un terme de rang donné d’une suite arithmétique définie par son premier terme et par une relation de récurrence ou par l’expression du terme de rang n.","comp":["real"]},{"id":"bp1.suites.o4","txt":"Réaliser et exploiter une représentation graphique du nuage de points (n; un) dans le cas où (un) est une suite arithmétique.","comp":["real"]},{"id":"bp1.suites.o5","txt":"Reconnaître les premiers termes d’une suite arithmétique.","comp":["sapp"]},{"id":"bp1.suites.o6","txt":"Déterminer le sens de variation d’une suite arithmétique à l’aide de sa raison.","comp":["real"]},{"id":"bp1.suites.o7","txt":"Calculer la somme des n premiers termes d’une suite arithmétique avec ou sans outils numériques.","comp":["real"]}],"connaissances":[{"id":"bp1.suites.k1","txt":"Suites numériques (un)","sous":["notation indicielle du terme de rang n de la suite (un)","un = ƒ(n) où ƒ est une fonction"]},{"id":"bp1.suites.k2","txt":"Sens de variation d’une suite numérique.","sous":[]},{"id":"bp1.suites.k3","txt":"Suites arithmétiques","sous":["définition par la relation un+1 = un + r et la donnée du premier terme","expression du terme de rang n en fonction du premier terme et de la raison","lien avec les fonctions affines","sens de variation"]},{"id":"bp1.suites.k4","txt":"Somme des n premiers termes d’une suite arithmétique.","sous":[]}],"bo":{"liens":["En classe de seconde, les élèves ont été confrontés à des exemples de fonctions définies sur ℕ pour modéliser des phénomènes discrets. En classe de première, ils génèrent les termes de différentes suites puis découvrent et étudient les suites arithmétiques."],"exemples":["− Calculer un terme de rang donné d’une suite numérique.","− Calculer la somme d’un nombre fini de termes d’une suite numérique.","− Générer une liste de termes d’une suite numérique et les représenter par un nuage de points de coordonnées (n ; un).","− Déterminer le rang à partir duquel les termes d’une suite numérique monotone sont supérieurs ou inférieurs à une valeur donnée."],"commentaires":["− En lien avec l’écriture fonctionnelle, on utilise, lors de l’introduction des suites, la notation u(n) préalablement à celle de un.","− On présente également des suites qui ne sont pas arithmétiques.","− L’étude des suites définies par une relation de récurrence, autres que les suites","arithmétiques, n’est pas au programme.","− La connaissance de la formule donnant la somme des n premiers termes d’une suite","arithmétique n’est pas exigée.","− La notation ∑n","ui peut être introduite en vue d’une poursuite d’études dans le","supérieur."]}},{"id":"bp1.resgraph","domaine":"Algèbre – Analyse","titre":"Résolution graphique d’équations et d’inéquations","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bp1.resgraph.o1","txt":"Résoudre graphiquement ou à l’aide d’un outil numérique des équations de la forme ƒ(x) = g(x) où ƒ et g sont des fonctions.","comp":["real"]},{"id":"bp1.resgraph.o2","txt":"Résoudre graphiquement ou à l’aide d’un outil numérique des inéquations de la forme ƒ(x) ⩾ g(x) où ƒ et g sont des fonctions.","comp":["real"]}],"connaissances":[{"id":"bp1.resgraph.k1","txt":"Résolution graphique d’équations de la forme ƒ(x) = g(x) où ƒ et g sont des fonctions.","sous":[]},{"id":"bp1.resgraph.k2","txt":"Résolution graphique d’inéquations de la forme ƒ(x) ⩾ g(x) où ƒ et g sont des fonctions.","sous":[]}],"bo":{"liens":["En classe de seconde professionnelle, les élèves ont appris à résoudre des équations et inéquations du type ƒ(x) = g(x) et ƒ(x) ⩾ g(x) dans lesquelles ƒ est une fonction affine ou une fonction du type x ↦ kx2 (avec k un nombre réel donné) et g une fonction constante. En classe de première, ils résolvent graphiquement des problèmes se ramenant à des équations et inéquations du type ƒ(x) = g(x) et ƒ(x) ⩾ g(x) dans lesquelles ƒ et g sont deux fonctions quelconques."],"exemples":["− Déterminer par balayage un encadrement ou une valeur approchée d’une solution d’une équation du type ƒ(x) = g(x) lorsqu’on sait qu’elle existe dans un intervalle donné."],"commentaires":["− Les fonctions ƒ et g seront définies sur le même intervalle.","− Lorsque les fonctions intervenant dans les équations ou inéquations à résoudre graphiquement ne sont pas étudiées en classe de première, leurs représentations graphiques sont fournies ou obtenues à l’aide d’un outil numérique."],"bivalence":["Ce module est mis en œuvre dans les domaines Électricité, Thermique et Mécanique du programme de physique-chimie."]}},{"id":"bp1.poly2","domaine":"Algèbre – Analyse","titre":"Fonctions polynômes de degré 2","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bp1.poly2.o1","txt":"Visualiser, à partir de la représentation graphique d’une fonction polynôme ƒ de degré 2, le nombre possible de solution(s) de l’équation ƒ(x) = 0.","comp":["real"]},{"id":"bp1.poly2.o2","txt":"Donner l’allure de la représentation graphique d’une fonction polynôme de degré 2 donnée sous forme factorisée.","comp":["real"]},{"id":"bp1.poly2.o3","txt":"Associer une parabole à une expression algébrique de degré 2 donnée.","comp":["sapp"]},{"id":"bp1.poly2.o4","txt":"Tester si un nombre réel est racine d’un polynôme de degré 2.","comp":["real"]},{"id":"bp1.poly2.o5","txt":"Factoriser un polynôme de degré 2 donné dont les racines réelles sont connues.","comp":["real"]},{"id":"bp1.poly2.o6","txt":"Déterminer les racines et le signe d’un polynôme de degré 2 donné sous forme factorisée.","comp":["real"]},{"id":"bp1.poly2.o7","txt":"Déterminer la deuxième solution d’une équation du second degré possédant deux solutions dont une solution est connue.","comp":["real"]}],"connaissances":[{"id":"bp1.poly2.k1","txt":"Fonction polynôme de degré 2 à coefficients réels.","sous":[]},{"id":"bp1.poly2.k2","txt":"Nombre de solutions réelles de l’équation ƒ(x) = 0 où ƒ est une fonction polynôme de degré 2.","sous":[]},{"id":"bp1.poly2.k3","txt":"Représentation graphique d’une fonction polynôme de degré 2 donnée sous la forme a(x – x1) (x – x2).","sous":[]},{"id":"bp1.poly2.k4","txt":"Éléments caractéristiques : signe de a, sommet, ordonnée à l’origine, axe de symétrie.","sous":[]},{"id":"bp1.poly2.k5","txt":"Racine réelle d’un polynôme de degré 2.","sous":[]},{"id":"bp1.poly2.k6","txt":"Racine(s) et signe d’un polynôme de degré 2 donné sous forme factorisée.","sous":[]}],"bo":{"liens":["En classe de seconde, les élèves ont appris à représenter une fonction affine et à résoudre graphiquement des équations du premier degré. En classe de première, ils découvrent les fonctions polynômes de degré 2 à coefficients réels."],"exemples":["− Déterminer par balayage un encadrement ou une valeur approchée d’une racine d’une fonction polynôme de degré 2 qui n’est pas donnée sous forme factorisée lorsqu’on sait qu’elle existe dans un intervalle donné."],"commentaires":["− Les propriétés sont admises à partir de conjectures émises après l’observation de","représentations graphiques effectuées à l’aide des outils numériques.","− Le calcul des racines à l’aide du discriminant ne figure pas au programme.","− Pour la résolution d’une équation du second degré, on se limite aux situations où","l’équation est donnée sous forme factorisée, à celles où l’on connaît au moins une des solutions et à celles pour lesquelles une des solutions est évidente. Dans les autres situations, une valeur approchée des solutions pourra être obtenue à l’aide","d’un solveur ou d’un script informatique.","− Les polynômes de degré 2 donnés sous forme factorisée admettent deux racines réelles distinctes ou une racine double."],"bivalence":["Ce module est mis en œuvre dans le domaine Électricité du programme de physique-chimie."]}},{"id":"bp1.deriv","domaine":"Algèbre – Analyse","titre":"Fonction dérivée et étude des variations d’une fonction","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bp1.deriv.o1","txt":"Construire en un point la tangente à la courbe représentative d’une fonction ƒ à l’aide d’outils numériques.","comp":["real"]},{"id":"bp1.deriv.o2","txt":"Déterminer, par une lecture graphique, lorsqu’il existe, le nombre dérivé d’une fonction ƒ en l’abscisse d’un point de la courbe représentative de cette fonction.","comp":["real"]},{"id":"bp1.deriv.o3","txt":"Construire en un point la tangente à la courbe représentative d’une fonction ƒ connaissant le nombre dérivé en ce point.","comp":["real"]},{"id":"bp1.deriv.o4","txt":"Écrire l’équation réduite de la tangente à une courbe en un point lorsqu’elle existe.","comp":["real"]},{"id":"bp1.deriv.o5","txt":"Utiliser les formules et les règles de dérivation pour déterminer la dérivée d’une fonction polynôme de degré inférieur ou égal à 2.","comp":["real"]},{"id":"bp1.deriv.o6","txt":"Étudier, sur un intervalle donné, les variations d’une fonction à partir du calcul et de l’étude du signe de sa dérivée.","comp":["ana"]},{"id":"bp1.deriv.o7","txt":"Dresser son tableau de variations.","comp":["real"]},{"id":"bp1.deriv.o8","txt":"Déterminer un extremum d’une fonction sur un intervalle donné à partir de son sens de variation.","comp":["real"]},{"id":"bp1.deriv.o9","txt":"Dresser le tableau de variations d’une fonction polynôme de degré inférieur ou égal à 2.","comp":["real"]},{"id":"bp1.deriv.o10","txt":"Étudier la fonction inverse: dérivée, variations, représentation graphique.","comp":["ana"]},{"id":"bp1.deriv.o11","txt":"Dresser son tableau de variations.","comp":["real"]}],"connaissances":[{"id":"bp1.deriv.k1","txt":"Sécantes à une courbe passant par un point. Tangente à une courbe en un point.","sous":[]},{"id":"bp1.deriv.k2","txt":"Nombre dérivé.","sous":[]},{"id":"bp1.deriv.k3","txt":"Équation réduite de la tangente à une courbe en un point.","sous":[]},{"id":"bp1.deriv.k4","txt":"Fonction dérivée d’une fonction dérivable sur un intervalle.","sous":[]},{"id":"bp1.deriv.k5","txt":"Notation ƒ’.","sous":[]},{"id":"bp1.deriv.k6","txt":"Fonctions dérivées des fonctions affines et carré.","sous":[]},{"id":"bp1.deriv.k7","txt":"Règles de dérivation : dérivée du produit d’une fonction dérivable par une constante, dérivée de la somme de deux fonctions dérivables.","sous":[]},{"id":"bp1.deriv.k8","txt":"Lien entre signe de la dérivée d’une fonction sur un intervalle et sens de variation de cette fonction sur cet intervalle.","sous":[]},{"id":"bp1.deriv.k9","txt":"Extremum d’une fonction sur un intervalle donné.","sous":[]},{"id":"bp1.deriv.k10","txt":"Extremum local et extremum global.","sous":[]},{"id":"bp1.deriv.k11","txt":"Fonction polynôme de degré inférieur ou égal à 2.","sous":[]},{"id":"bp1.deriv.k12","txt":"Fonction inverse.","sous":[]}],"bo":{"liens":["En classe de seconde, les élèves ont étudié les fonctions affines et la fonction carré. Ils ont appris à déduire des variations d’une fonction ƒ sur un intervalle donné, celles de la fonction kƒ où k est un réel donné. En classe de première, ils disposent d’une méthode experte pour étudier les variations des fonctions dérivables et découvrent les fonctions polynômes de degré 2 ainsi que la fonction inverse."],"exemples":["− Visualiser la tangente comme meilleure approximation affine de la fonction « à proximité » du point considéré."],"commentaires":["− Le nombre dérivé et la notion de tangente seront introduits en utilisant un logiciel de géométrie dynamique. La tangente en un point de la courbe est introduite comme position « limite des sécantes » passant par ce point.","− Le coefficient directeur de la tangente à la courbe représentative de la fonction ƒ au point A de coordonnées ( xA ; ƒ(xA) ) est appelé nombre dérivé de ƒ en xA. On le note ƒ’(xA).","− La fonction dérivée ƒ’ de la fonction ƒ est la fonction qui à tout x associe le nombre dérivé de la fonction ƒ en x.","− La formule de dérivation de la fonction carré est conjecturée à l’aide des outils","numériques puis admise.","− Les formules concernant la dérivée du produit d’une fonction dérivable par une constante et la dérivée de la somme de deux fonctions dérivables sont admises et appliquées sur des exemples ne nécessitant aucune virtuosité de calcul.","− Les formules sont progressivement introduites pour déterminer les dérivées de fonctions polynômes de degré inférieur ou égal à 2.","− Les théorèmes liant le sens de variation d’une fonction et le signe de sa dérivée sont","admis à partir de conjectures émises après l’observation des représentations","graphiques effectuées à l’aide des outils numériques.","− On visualise graphiquement la différence entre extremum local et extremum global.","− On constate graphiquement sur un exemple, en utilisant les outils numériques, que le seul fait que la dérivée d’une fonction s’annule en un point ne suffit pas pour conclure","que cette fonction possède un extremum local en ce point.","− Les formules des fonctions dérivées des fonctions affines et carré sont à connaître."],"bivalence":["Ce module est mis en œuvre dans les domaines Mécanique et Signaux du programme de physique-chimie."]}},{"id":"bp1.calc","domaine":"Algèbre – Analyse","titre":"Calculs commerciaux et financiers","portee":{"sans_pc":true},"objectifs":[{"id":"bp1.calc.o1","txt":"Calculer le montant d’un capital disponible après n périodes de placement à intérêt simple.","comp":["real"]},{"id":"bp1.calc.o2","txt":"Déterminer un taux.","comp":["real"]},{"id":"bp1.calc.o3","txt":"Calculer un coût total de production, un résultat, un coût marginal.","comp":["real"]},{"id":"bp1.calc.o4","txt":"Calculer un coût moyen unitaire.","comp":["real"]}],"connaissances":[{"id":"bp1.calc.k1","txt":"Intérêts simples.","sous":[]},{"id":"bp1.calc.k2","txt":"Taux annuel, mensuel, par quinzaine, journalier.","sous":[]},{"id":"bp1.calc.k3","txt":"Coût total de production. Résultat.","sous":[]},{"id":"bp1.calc.k4","txt":"Coût marginal.","sous":[]},{"id":"bp1.calc.k5","txt":"Coût moyen unitaire.","sous":[]}],"bo":{"objectifs":["Ce module permet de réinvestir, lors de l’étude de situations mettant en œuvre des calculs commerciaux et financiers, les capacités et connaissances concernant les suites arithmétiques, la dérivation et la fonction inverse."],"liens":["En classe de seconde, les élèves ont appris à utiliser ou établir divers documents (factures, bulletins de paye, documents financiers…) communément utilisés dans les organisations (entreprises commerciales, associations, établissements publics). En classe de première, ils abordent des situations professionnelles dans lesquelles interviennent des intérêts simples, des taux proportionnels et des coûts. Ce module se prête à des séances de co-intervention, par exemple lors de l’utilisation de logiciels métiers."],"exemples":["− Calculer le montant d’un capital obtenu après 𝑛 périodes de placement à intérêts simples.","− Déterminer un coût marginal.","− Déterminer un coût moyen unitaire."],"commentaires":["− Le coût marginal Cm(x) est défini par Cm(x) = C(x + 1) – C(x), où C(x) est le coût total de production de x unités. Pour des productions importantes, le coût marginal Cm(x) peut être approché par C’ (x). Les capacités et connaissances concernant la dérivation sont réinvesties dans les calculs des coûts marginaux.","− Les capacités et connaissances concernant les suites arithmétiques sont réinvesties dans les calculs concernant les intérêts simples et les taux proportionnels.","− Les capacités et connaissances concernant la fonction inverse sont réinvesties dans le calcul de coûts moyens.","Géométrie","En classe de première, les élèves approfondissent leurs connaissances géométriques de l’espace. Ils remobilisent les propriétés et théorèmes vus en classe de seconde pour étudier de nouvelles configurations ; ainsi, ils résolvent des problèmes mettant en jeu des solides ou leur section par un plan. Ils découvrent les vecteurs du plan, qui sont un outil efficace pour modéliser en physique, pour analyser des figures géométriques et résoudre des problèmes. Ils les manipulent dans le plan muni d’un repère orthogonal.","La fonction sinus est introduite grâce au cercle trigonométrique.","Dans le cadre de la résolution de problèmes, l’utilisation de logiciels de géométrie dynamique donne aux élèves une plus grande autonomie et encourage leur prise d’initiative."]}},{"id":"bp1.espace","domaine":"Géométrie","titre":"Géométrie dans l’espace","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bp1.espace.o1","txt":"Représenter un solide usuel à l’aide d’un logiciel de géométrie dynamique ou d’un logiciel métier.","comp":["real"]},{"id":"bp1.espace.o2","txt":"Exploiter une représentation d’un solide usuel ou d’un solide constitué d’un assemblage de solides usuels.","comp":["val"]},{"id":"bp1.espace.o3","txt":"En utilisant un logiciel de géométrie dynamique ou un logiciel métier: réaliser la section d’un solide usuel par un plan.","comp":["real"]},{"id":"bp1.espace.o4","txt":"En utilisant un logiciel de géométrie dynamique ou un logiciel métier: construire la section plane d’un solide passant par des points donnés.","comp":["real"]}],"connaissances":[{"id":"bp1.espace.k1","txt":"Solides usuels : le cube, le pavé droit, la pyramide, le cylindre droit, le cône, la boule.","sous":[]},{"id":"bp1.espace.k2","txt":"Section d’un solide par un plan.","sous":[]}],"bo":{"liens":["Au cycle 4, les élèves ont rencontré les notions d’abscisse, d’ordonnée et d’altitude et ont appris à se repérer dans un parallélépipède rectangle.","En classe de seconde professionnelle, les élèves ont consolidé les techniques de calcul avec des grandeurs mesurables d’une part, et leurs connaissances des figures et solides usuels d’autre part.","En classe de première, ce module permet d’approfondir les capacités et connaissances travaillées en classe de seconde professionnelle et d’étudier la notion de section d’un solide par un plan."],"commentaires":["− Les solides seront au besoin représentés dans l’espace rapporté à des repères","orthogonaux (introduits à l’occasion sans formalisme)."],"bivalence":["Ce module est mis en œuvre dans le domaine Mécanique du programme de physique- chimie."]}},{"id":"bp1.vect","domaine":"Géométrie","titre":"Vecteurs du plan","portee":{"grp":["A","B"]},"objectifs":[{"id":"bp1.vect.o1","txt":"Construire un représentant d’un vecteur non nul à partir de ses caractéristiques.","comp":["real"]},{"id":"bp1.vect.o2","txt":"Reconnaître graphiquement des vecteurs égaux, des vecteurs opposés, des vecteurs colinéaires.","comp":["sapp"]},{"id":"bp1.vect.o3","txt":"Construire le vecteur obtenu comme: somme de deux vecteurs.","comp":["real"]},{"id":"bp1.vect.o4","txt":"Construire le vecteur obtenu comme: produit d’un vecteur par un nombre réel non nul.","comp":["real"]},{"id":"bp1.vect.o5","txt":"Déterminer graphiquement les coordonnées d’un vecteur dans le plan rapporté à un repère orthogonal.","comp":["real"]},{"id":"bp1.vect.o6","txt":"Représenter, dans le plan rapporté à un repère orthogonal, un vecteur dont les coordonnées sont données.","comp":["real"]},{"id":"bp1.vect.o7","txt":"Calculer les coordonnées d’un vecteur connaissant les coordonnées des extrémités d’un de ses représentants.","comp":["real"]},{"id":"bp1.vect.o8","txt":"Dans le plan muni d’un repère orthogonal, calculer les coordonnées du vecteur obtenu comme: somme de deux vecteurs.","comp":["real"]},{"id":"bp1.vect.o9","txt":"Dans le plan muni d’un repère orthogonal, calculer les coordonnées du vecteur obtenu comme: produit d’un vecteur par un nombre réel.","comp":["real"]},{"id":"bp1.vect.o10","txt":"Reconnaître, à l’aide de leurs coordonnées, des vecteurs égaux, des vecteurs colinéaires dans le plan muni d’un repère orthogonal.","comp":["sapp"]},{"id":"bp1.vect.o11","txt":"Calculer la norme d’un vecteur dans le plan muni d’un repère orthonormé.","comp":["real"]}],"connaissances":[{"id":"bp1.vect.k1","txt":"Représentants d’un vecteur.","sous":[]},{"id":"bp1.vect.k2","txt":"Éléments caractéristiques d’un vecteur non nul : direction, sens et norme (ou longueur).","sous":[]},{"id":"bp1.vect.k3","txt":"Vecteurs égaux, vecteurs opposés, vecteurs colinéaires, vecteur nul.","sous":[]},{"id":"bp1.vect.k4","txt":"Somme de deux vecteurs.","sous":[]},{"id":"bp1.vect.k5","txt":"Produit d’un vecteur par un nombre réel.","sous":[]},{"id":"bp1.vect.k6","txt":"Coordonnées d’un vecteur dans le plan rapporté à un repère orthogonal.","sous":[]},{"id":"bp1.vect.k7","txt":"Coordonnées du vecteur A⃗⃗⃗⃗B⃗ dans le plan rapporté à un repère orthogonal où A et B sont deux points donnés du plan.","sous":[]},{"id":"bp1.vect.k8","txt":"Coordonnées du vecteur somme de deux vecteurs de coordonnées données.","sous":[]},{"id":"bp1.vect.k9","txt":"Coordonnées du vecteur produit d’un vecteur de coordonnées données par un nombre réel.","sous":[]},{"id":"bp1.vect.k10","txt":"Coordonnées de vecteurs égaux, colinéaires.","sous":[]},{"id":"bp1.vect.k11","txt":"Expression de la norme d’un vecteur dans le plan muni d’un repère orthonormé en fonction des coordonnées de ce vecteur.","sous":[]}],"bo":{"commentaires":["− Le lien entre produit d’un vecteur par un réel et la colinéarité est établi.","− Le lien entre vecteurs égaux et parallélogramme est établi.","− La norme d’un vecteur est définie comme la longueur d’un de ses représentants.","− Ce module est l’occasion d’étudier notamment :","- la nature de figures usuelles ;","- l’alignement de trois points ;","- le parallélisme de deux droites."],"bivalence":["Ce module est mis en œuvre dans les domaines Mécanique et Électricité du programme de physique-chimie."]}},{"id":"bp1.trigo","domaine":"Géométrie","titre":"Trigonométrie","portee":{"grp":["A","B"]},"objectifs":[{"id":"bp1.trigo.o1","txt":"Placer, sur le cercle trigonométrique, le point M image d’un nombre réel x donné par enroulement de la droite des réels sur le cercle trigonométrique.","comp":["real"]},{"id":"bp1.trigo.o2","txt":"Placer sur le cercle trigonométrique les points images des réels -x; π - x; π + x; π - x; π + x.","comp":["real"]},{"id":"bp1.trigo.o3","txt":"2 2 connaissant le point image du réel x.","comp":["real"]},{"id":"bp1.trigo.o4","txt":"Effectuer des conversions de degrés en radians, de radians en degrés.","comp":["real"]},{"id":"bp1.trigo.o5","txt":"Déterminer graphiquement, à l’aide du cercle trigonométrique, le cosinus et le sinus d’un nombre réel donné.","comp":["real"]},{"id":"bp1.trigo.o6","txt":"Utiliser le cercle trigonométrique pour écrire les cosinus et sinus des réels -x; π - x; π + x.","comp":["real"]},{"id":"bp1.trigo.o7","txt":"Π - x; π + x en fonction des cosinus et sinus du 2 2 réel x.","comp":["real"]},{"id":"bp1.trigo.o8","txt":"Construire point par point, à partir de l’enroulement de la droite des réels sur le cercle trigonométrique, la représentation graphique de la fonction sinus.","comp":["real"]},{"id":"bp1.trigo.o9","txt":"Exploiter la représentation graphique de la fonction sinus.","comp":["val"]},{"id":"bp1.trigo.o10","txt":"Construire la courbe représentative de la fonction cosinus par translation à partir de celle de la fonction sinus en utilisant l’identité cos x = sin(x + π).","comp":["real"]},{"id":"bp1.trigo.o11","txt":"2.","comp":["real"]}],"connaissances":[{"id":"bp1.trigo.k1","txt":"Cercle trigonométrique. Radian.","sous":[]},{"id":"bp1.trigo.k2","txt":"Angles supplémentaires, angles complémentaires, angles opposés.","sous":[]},{"id":"bp1.trigo.k3","txt":"La mesure en degrés d’un angle géométrique et sa mesure principale en radians sont proportionnelles (une mesure de l’angle plat est π radians).","sous":[]},{"id":"bp1.trigo.k4","txt":"Cosinus et sinus d’un nombre réel.","sous":[]},{"id":"bp1.trigo.k5","txt":"Cosinus et sinus des valeurs particulières suivantes : 0, π , π , π , π , π.","sous":[]},{"id":"bp1.trigo.k6","txt":"6 4 3 2 Propriétés : x étant un nombre réel, -1⩽ cos x ⩽ 1 -1⩽ sin x ⩽ 1 cos2 x + sin2 x = 1 Courbe représentative de la fonction sinus.","sous":[]},{"id":"bp1.trigo.k7","txt":"Périodicité de la fonction sinus.","sous":[]},{"id":"bp1.trigo.k8","txt":"Courbe représentative de la fonction cosinus.","sous":[]}],"bo":{"liens":["Au cycle 4, les élèves ont rencontré et utilisé les lignes trigonométriques dans le triangle rectangle."],"commentaires":["− Le lien sera fait entre les cosinus et sinus d’un nombre réel x ∈ ]0 ; π [ et les lignes","2","trigonométriques d’un angle de valeur 180 x degrés, d’un triangle rectangle dont","π","l’hypoténuse a pour longueur 1."],"bivalence":["Ce module est mis en œuvre dans les domaines Mécanique et Électricité du programme de physique-chimie."]}},{"id":"bp1.algo","domaine":"Algorithmique et programmation","titre":"Algorithmique et programmation","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bp1.algo.o1","txt":"Analyser un problème.","comp":["ana"]},{"id":"bp1.algo.o2","txt":"Décomposer un problème en sous-problèmes.","comp":["ana"]},{"id":"bp1.algo.o3","txt":"Repérer les enchaînements logiques et les traduire en instructions conditionnelles et en boucles.","comp":["sapp"]},{"id":"bp1.algo.o4","txt":"Choisir ou reconnaître le type d’une variable. Réaliser un calcul à l’aide d’une ou de plusieurs variables.","comp":["ana"]},{"id":"bp1.algo.o5","txt":"Modifier ou compléter un algorithme ou un programme.","comp":["real"]},{"id":"bp1.algo.o6","txt":"Concevoir un algorithme ou un programme simple pour résoudre un problème.","comp":["real"]},{"id":"bp1.algo.o7","txt":"Comprendre et utiliser des fonctions.","comp":["real"]},{"id":"bp1.algo.o8","txt":"Compléter la définition d’une fonction.","comp":["real"]},{"id":"bp1.algo.o9","txt":"Structurer un programme en ayant recours à des fonctions pour résoudre un problème donné.","comp":["real"]},{"id":"bp1.algo.o10","txt":"Générer une liste.","comp":["real"]},{"id":"bp1.algo.o11","txt":"Manipuler des éléments d’une liste (ajouter, supprimer, extraire…). Parcourir une liste.","comp":["real"]},{"id":"bp1.algo.o12","txt":"Itérer une ou plusieurs instructions sur les éléments d’une liste.","comp":["real"]}],"connaissances":[{"id":"bp1.algo.k1","txt":"Séquences d’instructions, instructions conditionnelles, boucles bornées (for) et non bornées (while).","sous":[]},{"id":"bp1.algo.k2","txt":"Types de variables : entiers, flottants, chaînes de caractères, booléens. Affectation d’une variable.","sous":[]},{"id":"bp1.algo.k3","txt":"Arguments d’une fonction.","sous":[]},{"id":"bp1.algo.k4","txt":"Valeur(s) renvoyée(s) par une fonction.","sous":[]},{"id":"bp1.algo.k5","txt":"Liste.","sous":[]}],"bo":{"liens":["En classe de seconde, les élèves ont travaillé sur les notions de variable, d’instruction conditionnelle et de boucle ainsi que sur l’utilisation des fonctions. En classe de première, ils approfondissent ces différentes notions. La seule nouveauté est celle de liste, qui trouve naturellement sa place dans de nombreuses parties du programme et permet de travailler des notions telles que les suites numériques, les tableaux de valeurs.","En continuité avec la classe de seconde, le langage utilisé est le langage Python."],"commentaires":["− Les notions abordées dans ce module ne font pas l’objet d’un cours spécifique et sont","travaillées en situation.","− Aucune maîtrise n’est attendue pour les propriétés des différents types de variables.","− Pour les fonctions en Python, dans des cas simples, on ne donne plus systématiquement aux élèves l’entête de la fonction (nom et arguments).","− Les notions relatives aux types de variables et à l’affectation sont consolidées. Pour un algorithme écrit en langage naturel, on utilise le symbole ← pour désigner","l’affectation, alors qu’en langage Python on utilise le signe =.","− L’accent est mis sur la programmation modulaire qui consiste à découper une tâche complexe en tâches plus simples.","− Les listes peuvent être générées en extension, par ajouts successifs d’éléments, et","en compréhension.","− La génération de liste en compréhension et en extension est mise en lien avec la notion d’ensemble. Les conditions apparaissant dans les listes définies en compréhension permettent de travailler la logique.","− La statistique à une variable et les suites numériques sont des domaines propices à","l’utilisation des listes.","− Afin d’éviter toute confusion, il est recommandé de se limiter aux listes sans","présenter d’autres types de collections."]}}],"automatismes":[{"id":"bp1.a1","txt":"Calcul de la probabilité d’un événement dans le cas d’une situation aléatoire simple.","groupe":"Tous"},{"id":"bp1.a2","txt":"Dénombrements à l’aide de tableaux à double entrée ou d’arbres donnés.","groupe":"Tous"},{"id":"bp1.a3","txt":"Lecture d’un graphique, d’un diagramme en secteurs, en bâtons ou en colonnes, d’un diagramme en boîte à moustaches ou toute autre représentation (repérage de l’origine du repère, les unités de graduation ou les échelles).","groupe":"Tous"},{"id":"bp1.a4","txt":"Association d’un graphique avec des données et vice-versa.","groupe":"Tous"},{"id":"bp1.a5","txt":"Calcul d’indicateurs de position ou de dispersion à l’aide d’outils numériques.","groupe":"Tous"},{"id":"bp1.a6","txt":"Résolution algébrique d’une équation du premier degré à une inconnue du type ax + b = c où a, b et c sont des entiers relatifs.","groupe":"Tous"},{"id":"bp1.a7","txt":"Résolution algébrique d’une inéquation du premier degré à une inconnue du type ax + b < c où a, b et c sont des entiers relatifs.","groupe":"Tous"},{"id":"bp1.a8","txt":"Reconnaissance d’une situation de proportionnalité et détermination de la fonction linéaire qui la modélise.","groupe":"Tous"},{"id":"bp1.a9","txt":"Reconnaissance de l’allure d’une représentation graphique à partir d’un tableau de variations donné.","groupe":"Tous"},{"id":"bp1.a10","txt":"Établissement du tableau de variations d’une fonction dont la courbe représentative est donnée.","groupe":"Tous"},{"id":"bp1.a11","txt":"Détermination graphique, lorsqu’ils existent, des extremums globaux d’une fonction sur un intervalle.","groupe":"Tous"},{"id":"bp1.a12","txt":"Calcul de l’ordonnée d’un point de la courbe représentative d’une fonction connaissant son abscisse et l’expression de la fonction.","groupe":"Tous"},{"id":"bp1.a13","txt":"Détermination graphique du coefficient directeur d’une droite non verticale.","groupe":"Tous"},{"id":"bp1.a14","txt":"Reconnaissance du parallélisme de deux droites d’équations réduites données.","groupe":"Tous"},{"id":"bp1.a15","txt":"Résolution graphique d’une équation du type ƒ(x) = c ou d’une inéquation du type ƒ(x) < c, où c est un réel donné et ƒ une fonction dont la représentation graphique est donnée.","groupe":"Tous"},{"id":"bp1.a16","txt":"Calcul du montant d’un intérêt simple et d’une valeur acquise2.","groupe":"Tous"},{"id":"bp1.a17","txt":"Distinction entre cercle, disque, sphère et boule.","groupe":"Tous"},{"id":"bp1.a18","txt":"Reconnaissance du cube, du pavé droit, de la pyramide, du cylindre droit, du cône et de la boule.","groupe":"Tous"},{"id":"bp1.a19","txt":"Calcul de l’aire d’un triangle, d’un carré, d’un rectangle, d’un disque.","groupe":"Tous"},{"id":"bp1.a20","txt":"Calcul du volume d’un cube, d’un pavé droit et d’un cylindre.","groupe":"Tous"},{"id":"bp1.a21","txt":"Factorisation de x2 – a2, a étant un entier naturel donné.","groupe":"Tous"},{"id":"bp1.a22","txt":"Développement de a(x + b), où a et b sont des entiers relatifs donnés.","groupe":"Tous"},{"id":"bp1.a23","txt":"Développement de (x + a) (x + b), où a et b sont des entiers relatifs donnés.","groupe":"Tous"}],"vocabulaire":["L’apprentissage des notations mathématiques, de la logique et des raisonnements est transversal à tous les chapitres du programme des trois années de formation. Aussi, il importe d’y travailler d’abord dans des contextes où ils se présentent naturellement, puis de prévoir des moments pour effectuer une synthèse de certains concepts ou une explicitation de types de raisonnement, après que ceux-ci ont été rencontrés plusieurs fois en situation.","Les élèves doivent connaître les notions d’élément d’un ensemble, de sous-ensemble, d’appartenance et d’inclusion, de réunion, d’intersection et de complémentaire et savoir utiliser les symboles de base correspondant : ∈, ⊂, ⋂, ⋃, ainsi que la notation des ensembles de nombres et des intervalles du type [ a ; b ] , ] a ; b [ , [ a ; b [ , ] a ; b ] avec a et b réels. Ils rencontrent également la notion de couple.","Pour le complémentaire d’un sous-ensemble A de E, on utilise la notation des probabilités Ā. Pour ce qui concerne le raisonnement logique, les élèves rencontrent à la faveur","d’exemples :","− les connecteurs logiques « et », « ou » ;","− le quantificateur « quel que soit » et le quantificateur « il existe » (les symboles ∀ et ∃","sont hors programme) ;","− des implications et équivalences logiques ;","− la réciproque d’une implication ;","− l’utilisation d’un contre-exemple pour infirmer une proposition universelle ;","− des raisonnements par disjonction des cas, des raisonnements par l’absurde.","Les élèves distinguent les utilisations possibles du symbole = (égalité, identité, équation) et le statut des lettres utilisées (variable, indéterminée, inconnue, paramètre).","2 Cet automatisme est à tester uniquement dans les classes de baccalauréat n’ayant pas d’enseignement de physique-chimie."]},{"id":"bpt","label":"Terminale Bac Pro","niveau":"Tle pro","voie":"pro","bo":"Programme de mathématiques de la classe terminale professionnelle (annexe 2, BO spécial n°1 du 6 février 2020)","competences":"pro","chapitres":[{"id":"bpt.stat2","domaine":"Statistique et probabilités","titre":"Statistiques à deux variables","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bpt.stat2.o1","txt":"À l’aide d’outils numériques: choisir un modèle adapté pour réaliser un ajustement d’un nuage de points associé à une série statistique à deux variables.","comp":["real"]},{"id":"bpt.stat2.o2","txt":"À l’aide d’outils numériques: utiliser un ajustement pour interpoler ou extrapoler des valeurs inconnues.","comp":["real"]}],"connaissances":[{"id":"bpt.stat2.k1","txt":"Ajustement d’un nuage de points associé à une série statistique à deux variables quantitatives.","sous":[]}],"bo":{"liens":["En classe de première, les élèves ont découvert quelques notions sur les statistiques à deux variables et l’ajustement affine. En classe terminale, ils consolident les acquis de la classe de première et rencontrent de nouveaux types d’ajustement. Cela permet de réinvestir des fonctions étudiées en classe terminale telles que la fonction logarithme décimal ou les fonctions exponentielles."],"commentaires":["− Les ajustements réalisés ne sont pas uniquement affines.","− Aucune justification théorique du modèle choisi n’est attendue.","− On indique aux élèves l’ajustement à réaliser (ajustement de x en y ou de y en x).","On propose aux élèves quelques exemples pour lesquels on se ramène à un ajustement affine d’un nuage de points après avoir effectué un changement de variable indiqué aux élèves (par exemple, z = log(y), z = 1/x, z = qx…). Ces exemples pourront être présentés lors de l’étude des fonctions intervenant dans ces changements de variable. La valeur du coefficient de détermination, entre les nouvelles variables, calculée à l’aide d’outils numériques, peut être un indicateur de la pertinence du modèle linéaire conjecturé obtenu avant de revenir à la relation liant les variables initiales. Ces changements de variable seront également l’occasion de réinvestir les propriétés opératoires de certaines fonctions et en particulier celles de la fonction logarithme décimal ou des fonctions exponentielles de base q."],"bivalence":["Ce module est mis en œuvre dans les domaines Mécanique et Électricité du programme de physique-chimie."]}},{"id":"bpt.proba","domaine":"Statistique et probabilités","titre":"Probabilités","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bpt.proba.o1","txt":"Représenter par un arbre de probabilités pondéré une situation aléatoire donnée.","comp":["real"]},{"id":"bpt.proba.o2","txt":"Exploiter la lecture d’un arbre de probabilités pondéré pour déterminer les probabilités des événements associés aux différents chemins.","comp":["val"]},{"id":"bpt.proba.o3","txt":"Dans des cas simples, calculer une probabilité à l’aide de la formule des probabilités totales.","comp":["real"]},{"id":"bpt.proba.o4","txt":"Montrer que deux événements sont indépendants.","comp":["real"]}],"connaissances":[{"id":"bpt.proba.k1","txt":"Arbres de probabilités pondérés : nœud, branche, chemin.","sous":[]},{"id":"bpt.proba.k2","txt":"Probabilité conditionnée par un événement de probabilité non nulle.","sous":[]},{"id":"bpt.proba.k3","txt":"Règles de calculs des probabilités. Formule des probabilités totales.","sous":[]},{"id":"bpt.proba.k4","txt":"Indépendance de deux événements de probabilités non nulles.","sous":[]},{"id":"bpt.proba.k5","txt":"Dans le cas d’événements indépendants","sous":[]},{"id":"bpt.proba.k6","txt":"P(A⋂B) = P(A) × P(B)","sous":[]}],"bo":{"liens":["En classe de première, les élèves ont traduit des événements en langage ensembliste et calculé des probabilités liées à des situations concernant des événements équiprobables ou non. Ils ont exploité des tableaux croisés d’effectifs ou de fréquences, des diagrammes, et ont découvert les notions de fréquence conditionnelle et de probabilité conditionnelle.","En classe terminale, les élèves apprennent à construire un arbre de probabilités pondéré en lien avec une situation donnée. Ils réinvestissent la notion de probabilité conditionnelle et abordent les expériences aléatoires à plusieurs épreuves. La notion d’indépendance est formalisée."],"commentaires":["− Les premiers arbres pondérés et le vocabulaire associé sont introduits à partir des tableaux croisés d’effectifs vus en classe de première ; leur utilisation est ensuite généralisée aux cas d’expériences aléatoires à plusieurs épreuves, indépendantes ou non.","− La formule des probabilités totales est systématiquement mise en relation avec un arbre de probabilités pondéré et appliquée sans formalisme. Elle est présentée sur un exemple et peut illustrer, dans des situations simples, un raisonnement par disjonction de cas.","Algèbre – Analyse","Ce domaine permet de poursuivre la formation des élèves à la résolution de problèmes, notamment grâce à la modélisation. Il permet la mise en œuvre de démarches déjà rencontrées les années précédentes, en mobilisant le calcul numérique ou algébrique, le recours aux outils numériques dans le cadre de phénomènes plus complexes d’évolution discrète ou continue.","Les situations choisies seront, autant que faire se peut, en lien avec les métiers préparés et permettront de sensibiliser les élèves aux enjeux du changement climatique et du développement durable.","Les objectifs principaux de ce domaine sont de :","− modéliser une situation ;","− résoudre des problèmes en choisissant une méthode adaptée ;","− découvrir et étudier un nouveau type de suites et de nouvelles fonctions.","L’étude des fonctions est facilitée par l’utilisation de tableurs et de logiciels de géométrie","dynamique.","L’utilisation des outils numériques permet d’étudier des situations que pourraient rencontrer les élèves dans d’autres disciplines ou dans le domaine professionnel. Il s’agit dans tous les cas d’éviter les excès de technicité liés aux calculs algébriques, à la résolution d’équations, d’inéquations ou de systèmes d’équations, ou à la construction de courbes représentatives de fonctions non étudiées."]}},{"id":"bpt.suites","domaine":"Algèbre – Analyse","titre":"Suites numériques","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bpt.suites.o1","txt":"Calculer un terme de rang donné d’une suite géométrique définie par son premier terme et par une relation de récurrence ou par l’expression du terme de rang n.","comp":["real"]},{"id":"bpt.suites.o2","txt":"Réaliser et exploiter une représentation graphique du nuage de points (n; un) dans le cas où (un) est une suite géométrique.","comp":["real"]},{"id":"bpt.suites.o3","txt":"Déterminer le sens de variation d’une suite géométrique à l’aide de sa raison q avec q > 0 et de son premier terme.","comp":["real"]},{"id":"bpt.suites.o4","txt":"Calculer la somme des n premiers termes d’une suite géométrique avec ou sans outils numériques.","comp":["real"]}],"connaissances":[{"id":"bpt.suites.k1","txt":"Suites géométriques de raison strictement positive","sous":["définies par la relation un+1 = un × q et la donnée du premier terme","expression du terme de rang n en fonction du premier terme et de la raison","sens de variation"]},{"id":"bpt.suites.k2","txt":"Somme des n premiers termes d’une suite géométrique.","sous":[]}],"bo":{"liens":["En classe de première, les élèves ont appris à modéliser des phénomènes discrets à l’aide de suites numériques. Ils ont étudié les suites arithmétiques. En classe terminale, ils réinvestissent les suites arithmétiques en contexte et étudient les suites géométriques de raison strictement positive."],"exemples":["− Calculer un terme de rang donné d’une suite géométrique.","− Calculer la somme d’un nombre fini de termes d’une suite numérique.","− Générer une liste de termes d’une suite géométrique et les représenter par un nuage de points de coordonnées (𝑛 , 𝑢��).","− Déterminer le rang à partir duquel les termes d’une suite géométrique sont supérieurs ou inférieurs à une valeur donnée."],"commentaires":["− La connaissance de la formule donnant la somme des 𝑛 premiers termes d’une suite","géométrique n’est pas exigée.","− La notation ∑n","ui peut être introduite en vue d’une poursuite d’études dans le","supérieur.","− Le lien entre les suites géométriques et les fonctions exponentielles est établi.","− Pour illustrer l’utilisation d’une suite géométrique, des exemples de modélisation","d’une évolution à taux fixe peuvent être proposés."]}},{"id":"bpt.poly3","domaine":"Algèbre – Analyse","titre":"Fonctions polynômes de degré 3","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bpt.poly3.o1","txt":"Étudier la fonction cube: dérivée, variations, représentation graphique.","comp":["ana"]},{"id":"bpt.poly3.o2","txt":"Utiliser les formules et les règles de dérivation pour déterminer la dérivée d’une fonction polynôme de degré inférieur ou égal à 3.","comp":["real"]},{"id":"bpt.poly3.o3","txt":"Dresser, à partir du signe de la dérivée, le tableau de variations d’une fonction polynôme de degré inférieur ou égal à 3.","comp":["real"]},{"id":"bpt.poly3.o4","txt":"Exploiter le tableau de variations d’une fonction polynôme ƒ de degré inférieur ou égal à 3 pour: déterminer le nombre des solutions de l’équation ƒ(x) = c, où c est un nombre réel.","comp":["val"]},{"id":"bpt.poly3.o5","txt":"Exploiter le tableau de variations d’une fonction polynôme ƒ de degré inférieur ou égal à 3 pour: déterminer les éventuels extremums locaux de la fonction ƒ.","comp":["val"]}],"connaissances":[{"id":"bpt.poly3.k1","txt":"Fonction cube.","sous":[]},{"id":"bpt.poly3.k2","txt":"Dérivée de la fonction cube.","sous":[]},{"id":"bpt.poly3.k3","txt":"Fonction polynôme de degré 3.","sous":[]}],"bo":{"liens":["En classe de première, les élèves ont étudié les variations des fonctions polynômes de degré 2 à partir de l’étude du signe de leur fonction dérivée. En classe terminale, ils réinvestissent, sur les fonctions polynômes de degré 3, leurs connaissances concernant l’étude des variations d’une fonction et celles concernant le signe d’un polynôme de degré 2."],"exemples":["− Déterminer un encadrement ou une valeur approchée par balayage d’une solution d’une équation du type ƒ(x) = g(x) lorsqu’on sait qu’elle existe dans un intervalle donné."],"commentaires":["− Constater, à l’aide de la fonction cube, que le seul fait que la dérivée d’une fonction s’annule en un point ne suffit pas pour conclure que cette fonction possède un extremum local en ce point.","− Lorsque la dérivée d’une fonction polynôme de degré 3 n’est pas facilement factorisable, l’outil numérique peut permettre de déterminer les racines éventuelles de la dérivée ; ceci permet d’établir le tableau de variations de cette fonction."]}},{"id":"bpt.expo","domaine":"Algèbre – Analyse","titre":"Fonctions exponentielles et logarithme décimal","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bpt.expo.o1","txt":"Représenter graphiquement les fonctions exponentielles de base q, définies sur un intervalle donné, par x ↦ q x (avec q nombre réel strictement positif et différent de 1).","comp":["real"]},{"id":"bpt.expo.o2","txt":"Utiliser les propriétés opératoires des fonctions exponentielles étudiées pour transformer des écritures numériques ou littérales.","comp":["real"]},{"id":"bpt.expo.o3","txt":"Représenter graphiquement la fonction logarithme décimal sur un intervalle donné.","comp":["real"]},{"id":"bpt.expo.o4","txt":"Résoudre par le calcul, graphiquement, ou à l’aide d’outils numériques des équations du type q x = a et log(x) = a ou des inéquations du type q x ⩾ a (ou q x ⩽ a) et log(x) ⩾ a (ou log(x) ⩽ a).","comp":["real"]}],"connaissances":[{"id":"bpt.expo.k1","txt":"Fonctions exponentielles de base q, définies sur un intervalle donné par x ↦ q x (avec q nombre réel strictement positif et différent de 1).","sous":[]},{"id":"bpt.expo.k2","txt":"Variations des fonctions exponentielles de base q, définies sur un intervalle donné par x ↦ q x (avec q nombre réel strictement positif et différent de 1).","sous":[]},{"id":"bpt.expo.k3","txt":"Propriétés opératoires des fonctions exponentielles étudiées.","sous":[]},{"id":"bpt.expo.k4","txt":"Fonction logarithme décimal x ↦ log(x). Variations de la fonction logarithme décimal. Propriétés opératoires de la fonction logarithme décimal.","sous":[]},{"id":"bpt.expo.k5","txt":"Résolution d’équations du type q x = a et log(x) = a ou d’inéquations du type q x ⩾ a (ou q x ⩽ a) et log(x) ⩾ a (ou log(x) ⩽ a).","sous":[]}],"bo":{"exemples":["− Déterminer un encadrement ou une valeur approchée par balayage d’une solution d’une équation du type ƒ(x) = g(x) lorsqu’on sait qu’elle existe dans un intervalle donné."],"commentaires":["− Les fonctions exponentielles sont à présenter sur l’ensemble des réels positifs comme prolongement, à des valeurs positives non entières, des suites géométriques de premier terme 1 et de raison q strictement positive. La fonction obtenue sur ℝ+ est","étendue à l’ensemble des réels en posant q -x= 1","q x","et ses variations sont admises.","− En s’appuyant sur les propriétés des suites géométriques de raison strictement positive, différente de 1, les propriétés opératoires des fonctions x ↦ q x et leurs variations sont admises après conjecture à l’aide d’outils numériques.","− La fonction logarithme décimal est introduite à partir de la fonction ƒ définie par ƒ(x) = 10 x et de son tableau de variations : le logarithme décimal de b, pour b strictement positif, est défini comme l’unique solution de l’équation 10 x = b.","− L’identité log(10 x ) = x se déduit de la définition.","− Selon les besoins, on pourra présenter et utiliser du papier semi-logarithmique,","notamment pour exploiter le tracé d’une droite sur ce type de support papier."],"bivalence":["Ce module est mis en œuvre dans les domaines Chimie et Signaux du programme de physique-chimie."]}},{"id":"bpt.calc","domaine":"Algèbre – Analyse","titre":"Calculs commerciaux et financiers","portee":{"sans_pc":true},"objectifs":[{"id":"bpt.calc.o1","txt":"Calculer le montant du capital obtenu après n périodes d’un placement à intérêts composés.","comp":["real"]},{"id":"bpt.calc.o2","txt":"Déterminer la durée n de placement d’un capital initial c0 à un taux t donné, pour obtenir un capital donné.","comp":["real"]},{"id":"bpt.calc.o3","txt":"Compléter un tableau d’amortissement.","comp":["real"]},{"id":"bpt.calc.o4","txt":"Calculer un taux mensuel équivalent à un taux annuel donné.","comp":["real"]},{"id":"bpt.calc.o5","txt":"Calculer un taux moyen.","comp":["real"]}],"connaissances":[{"id":"bpt.calc.k1","txt":"Intérêts composés. Formule cn = c0 (1 + t ) n.","sous":[]},{"id":"bpt.calc.k2","txt":"Emprunt : remboursement par annuités constantes, remboursement par amortissement constant.","sous":[]},{"id":"bpt.calc.k3","txt":"Coût d’un emprunt.","sous":[]},{"id":"bpt.calc.k4","txt":"Taux mensuel, taux annuel, taux moyen.","sous":[]}],"bo":{"objectifs":["Ce module permet de réinvestir, lors de l’étude de situations mettant en œuvre des calculs commerciaux et financiers, les capacités et connaissances concernant les suites arithmétiques ou géométriques, les fonctions exponentielles et la fonction logarithme décimal."],"liens":["En classe de première, les élèves ont étudié des situations professionnelles dans lesquelles interviennent des intérêts simples, des taux proportionnels et des coûts. En classe terminale, ils étudient le cas des intérêts composés. Comme en classes de seconde et de première, ce module se prête à des séances de co-intervention."],"exemples":["− Calculer le capital obtenu après 𝑛 périodes de placement à intérêts composés.","− Calculer une durée de placement pour obtenir un capital donné à un taux de placement à intérêts composés connu.","− Calculer le montant des annuités, des mensualités dans le cadre d’un crédit.","− Calculer le coût d’un crédit.","− Calculer un taux moyen."],"commentaires":["− La première ligne des tableaux d’amortissement proposés est fournie entièrement, la deuxième partiellement.","− L’enseignement de ce module se fera, dans la mesure du possible, en collaboration","avec l’enseignement professionnel.","Géométrie","Ce domaine se compose de deux modules, le module « Vecteurs » destiné aux spécialités de baccalauréat professionnel du groupement B, le module « Trigonométrie » destiné aux spécialités de baccalauréat professionnel du groupement A. Ces modules permettent, chacun, d’approfondir et de compléter les notions étudiées en classes de seconde et de première, en lien avec des situations que pourraient rencontrer les élèves dans d’autres disciplines ou dans le domaine professionnel. Ils ont notamment pour objet d’apprendre à manipuler les vecteurs dans l’espace muni d’un repère orthonormé et d’approfondir l’étude des fonctions trigonométriques."]}},{"id":"bpt.vect","domaine":"Géométrie","titre":"Vecteurs","portee":{"grp":["B"]},"objectifs":[{"id":"bpt.vect.o1","txt":"Déterminer graphiquement les coordonnées d’un vecteur dans l’espace muni d’un repère orthonormé.","comp":["real"]},{"id":"bpt.vect.o2","txt":"Représenter, dans l’espace muni d’un repère orthonormé, un vecteur dont les coordonnées sont données.","comp":["real"]},{"id":"bpt.vect.o3","txt":"Calculer la norme d’un vecteur dans l’espace muni d’un repère orthonormé.","comp":["real"]},{"id":"bpt.vect.o4","txt":"Calculer les coordonnées du vecteur somme de deux vecteurs dans l’espace muni d’un repère orthonormé.","comp":["real"]},{"id":"bpt.vect.o5","txt":"Reconnaître, à l’aide de leurs coordonnées, des vecteurs égaux ou colinéaires dans l’espace muni d’un repère orthonormé.","comp":["sapp"]}],"connaissances":[{"id":"bpt.vect.k1","txt":"Dans l’espace muni d’un repère orthonormé","sous":["coordonnées cartésiennes d’un point","coordonnées d’un vecteur"]},{"id":"bpt.vect.k2","txt":"Norme d’un vecteur dans l’espace muni d’un repère orthonormé.","sous":[]},{"id":"bpt.vect.k3","txt":"Coordonnées du vecteur somme de deux vecteurs donnés dans l’espace muni d’un repère orthonormé.","sous":[]},{"id":"bpt.vect.k4","txt":"Coordonnées du produit d’un vecteur par un nombre réel dans l’espace muni d’un repère orthonormé.","sous":[]}],"bo":{"liens":["En classe de première, les élèves ont revu les solides usuels et découvert la notion de vecteurs dans le plan. Ils ont appris à :","− reconnaître des vecteurs égaux, opposés, colinéaires ;","− calculer la norme d’un vecteur dans le plan muni d’un repère orthonormé.","En classe terminale, on étend à l’espace, sans formalisme, les notions vues en classe de première concernant les vecteurs du plan."],"commentaires":["− Le lien entre le produit d’un vecteur par un réel et la colinéarité est établi.","− La norme d’un vecteur est définie comme la longueur d’un de ses représentants."],"bivalence":["Ce module est mis en œuvre dans les domaines Mécanique et Électricité du programme de physique-chimie."]}},{"id":"bpt.trigo","domaine":"Géométrie","titre":"Trigonométrie","portee":{"grp":["A"]},"objectifs":[{"id":"bpt.trigo.o1","txt":"Établir des liens entre le vecteur de Fresnel d’une tension ou d’une intensité sinusoïdale de la forme a sin( t + ) et la courbe représentative de la fonction qui à t associe a sin( t + ).","comp":["real"]},{"id":"bpt.trigo.o2","txt":"Résoudre les équations de la forme: cos x = a, sin x = b sur l’intervalle ]-π,π] et sin( t + ) = c sur un intervalle approprié au contexte.","comp":["real"]}],"connaissances":[{"id":"bpt.trigo.k1","txt":"Représentation de Fresnel d’une grandeur sinusoïdale.","sous":[]},{"id":"bpt.trigo.k2","txt":"Équations de la forme cos x = a, sin x = b et sin( t + ) = c sur un intervalle donné.","sous":[]}],"bo":{"liens":["En classe de première, les élèves ont découvert le cercle trigonométrique et les fonctions sinus et cosinus. En classe terminale, ils font le lien entre vecteurs de Fresnel et fonctions trigonométriques. Ils apprennent à résoudre certaines équations trigonométriques."],"commentaires":["− Ce module est traité en s’appuyant sur des exemples concrets issus du domaine professionnel."],"bivalence":["Ce module est mis en œuvre dans le domaine Électricité du programme de physique-chimie."]}},{"id":"bpt.algo","domaine":"Algorithmique et programmation","titre":"Algorithmique et programmation","portee":{"grp":["A","B","C"]},"objectifs":[{"id":"bpt.algo.o1","txt":"Analyser un problème.","comp":["ana"]},{"id":"bpt.algo.o2","txt":"Décomposer un problème en sous-problèmes.","comp":["ana"]},{"id":"bpt.algo.o3","txt":"Repérer les enchaînements logiques et les traduire en instructions conditionnelles et en boucles.","comp":["sapp"]},{"id":"bpt.algo.o4","txt":"Choisir ou reconnaître le type d’une variable. Réaliser un calcul à l’aide d’une ou de plusieurs variables.","comp":["ana"]},{"id":"bpt.algo.o5","txt":"Modifier ou compléter un algorithme ou un programme.","comp":["real"]},{"id":"bpt.algo.o6","txt":"Concevoir un algorithme ou un programme simple pour résoudre un problème.","comp":["real"]},{"id":"bpt.algo.o7","txt":"Comprendre et utiliser des fonctions.","comp":["real"]},{"id":"bpt.algo.o8","txt":"Compléter la définition d’une fonction.","comp":["real"]},{"id":"bpt.algo.o9","txt":"Structurer un programme en ayant recours à des fonctions pour résoudre un problème donné.","comp":["real"]},{"id":"bpt.algo.o10","txt":"Générer une liste.","comp":["real"]},{"id":"bpt.algo.o11","txt":"Manipuler des éléments d’une liste (ajouter, supprimer, extraire, etc.).","comp":["real"]},{"id":"bpt.algo.o12","txt":"Parcourir une liste.","comp":["real"]},{"id":"bpt.algo.o13","txt":"Itérer une ou plusieurs instructions sur les éléments d’une liste.","comp":["real"]}],"connaissances":[{"id":"bpt.algo.k1","txt":"Séquences d’instructions, instructions conditionnelles, boucles bornées (for) et non bornées (while).","sous":[]},{"id":"bpt.algo.k2","txt":"Types de variables : entiers, flottants, chaînes de caractères, booléens.","sous":[]},{"id":"bpt.algo.k3","txt":"Affectation d’une variable.","sous":[]},{"id":"bpt.algo.k4","txt":"Arguments d’une fonction.","sous":[]},{"id":"bpt.algo.k5","txt":"Valeur(s) renvoyée(s) par une fonction.","sous":[]},{"id":"bpt.algo.k6","txt":"Liste.","sous":[]}],"bo":{"liens":["En classe de première, les élèves ont travaillé sur les notions de variable, d’instruction conditionnelle et de boucle ainsi que sur l’utilisation des fonctions et ont découvert les listes. En classe terminale, ils approfondissent ces différentes notions.","En continuité avec les classes de seconde et de première, le langage utilisé est le langage","Python."],"commentaires":["− Les notions abordées dans ce module ne font pas l’objet d’un cours spécifique et sont","travaillées en situation.","− La maîtrise des propriétés des différents types de variables n’est pas attendue.","− Pour les fonctions en Python, dans des cas simples, on ne donne pas","systématiquement aux élèves l’en-tête de la fonction (nom et arguments).","− Les notions relatives aux types de variables et à l’affectation sont consolidées. Pour un algorithme écrit en langage naturel, on utilise le symbole ← pour désigner l’affectation, alors qu’en langage Python, on utilise le signe =.","− L’accent est mis sur la programmation modulaire qui permet de découper une tâche","complexe en tâches plus simples.","− Les listes peuvent être générées en extension, par ajouts successifs d’éléments, et en compréhension.","− La génération de listes en compréhension et en extension est mise en lien avec la notion d’ensemble. Les conditions apparaissant dans les listes définies en compréhension permettent de travailler la logique.","− Afin d’éviter toute confusion, il est recommandé de se limiter aux listes sans","présenter d’autres types de collections."]}},{"id":"bpt.integ","domaine":"Poursuite d’études (complément)","titre":"Calcul intégral","portee":{"poursuite":true},"objectifs":[{"id":"bpt.integ.o1","txt":"Déterminer les primitives des fonctions usuelles par lecture inverse d’un tableau des dérivées.","comp":["real"]},{"id":"bpt.integ.o2","txt":"Déterminer, avec ou sans outils numériques, les primitives d’une somme de fonctions, du produit d’une fonction par un réel.","comp":["real"]}],"connaissances":[{"id":"bpt.integ.k1","txt":"Primitives d’une fonction sur un intervalle.","sous":[]},{"id":"bpt.integ.k2","txt":"La fonction F étant une primitive d’une fonction ƒ sur un intervalle, F + k (où k est une constante) est aussi une primitive de ƒ.","sous":[]},{"id":"bpt.integ.k3","txt":"Primitives d’une somme de fonctions, du produit d’une fonction par un réel.","sous":[]}],"bo":{"commentaires":["− Il n’est imposé aucune virtuosité calculatoire.","− Le calcul d’aire est plus spécifiquement destiné aux élèves choisissant une poursuite","d’études dans le secteur industriel.","− Une approximation de la valeur de l’intégrale d’une fonction positive sur un intervalle [ a , b ] par la méthode des rectangles peut être obtenue à l’aide des outils numériques."]}},{"id":"bpt.lnexp","domaine":"Poursuite d’études (complément)","titre":"Fonctions logarithme népérien et exponentielle","portee":{"poursuite":true},"objectifs":[{"id":"bpt.lnexp.o1","txt":"Étudier les variations et représenter graphiquement la fonction logarithme népérien, sur un intervalle donné.","comp":["ana"]},{"id":"bpt.lnexp.o2","txt":"Utiliser les propriétés opératoires de la fonction logarithme népérien pour transformer des écritures numériques ou littérales.","comp":["real"]},{"id":"bpt.lnexp.o3","txt":"Passer de ln(x) = a à x = e a et inversement, a étant un réel et x un réel strictement positif.","comp":["real"]},{"id":"bpt.lnexp.o4","txt":"Utiliser les propriétés opératoires de la fonction exponentielle pour transformer des écritures numériques ou littérales.","comp":["real"]},{"id":"bpt.lnexp.o5","txt":"Étudier les variations et représenter graphiquement la fonction exponentielle sur ℝ.","comp":["ana"]}],"connaissances":[{"id":"bpt.lnexp.k1","txt":"Fonction logarithme népérien x ↦ ln(x).","sous":[]},{"id":"bpt.lnexp.k2","txt":"Définition du nombre e. Propriétés opératoires de la fonction logarithme népérien.","sous":[]},{"id":"bpt.lnexp.k3","txt":"Fonction exponentielle de base e.","sous":[]},{"id":"bpt.lnexp.k4","txt":"Propriétés opératoires de la fonction exponentielle de base e.","sous":[]}],"bo":{"commentaires":["− La fonction logarithme népérien x ↦ ln(x) est la fonction définie sur l’ensemble des réels strictement positifs, qui s’annule en 1 et dont la dérivée est la fonction inverse.","− On pourra faire le lien entre la fonction logarithme népérien et la fonction logarithme décimal.","− Les propriétés opératoires de la fonction logarithme népérien sont admises.","− Le nombre e étant défini comme l’unique solution de l’équation ln(x) = 1, la représentation graphique de la fonction x ↦ e x est obtenue, à l’aide des outils numériques, à partir de celle de la fonction logarithme népérien.","− On fera remarquer que la fonction exponentielle introduite dans ce module est un cas particulier des fonctions x ↦ q x."]}},{"id":"bpt.cplx","domaine":"Poursuite d’études (complément)","titre":"Nombres complexes","portee":{"poursuite":true},"objectifs":[{"id":"bpt.cplx.o1","txt":"Calculer et interpréter géométriquement dans le plan rapporté à un repère orthonormé direct, la partie réelle, la partie imaginaire, le conjugué, le module d’un nombre complexe et un argument d’un nombre complexe non nul.","comp":["real"]},{"id":"bpt.cplx.o2","txt":"Passer de la forme algébrique à la forme trigonométrique et réciproquement.","comp":["real"]}],"connaissances":[{"id":"bpt.cplx.k1","txt":"Forme algébrique","sous":["partie réelle, partie imaginaire, conjugué, module","égalité de deux nombres complexes","représentation dans le plan rapporté à un repère orthonormé direct, affixe d’un point, d’un vecteur","somme, produit, quotient de deux nombres complexes","conjugué d’une somme, d’un produit, d’un quotient","module d’un produit et d’un quotient"]},{"id":"bpt.cplx.k2","txt":"Argument et forme trigonométrique d’un nombre complexe non nul.","sous":[]}],"bo":{"commentaires":["− L’image de la somme et celle du produit de deux nombres complexes peuvent être illustrées à l’aide d’un logiciel de géométrie dynamique."]}},{"id":"bpt.scal","domaine":"Poursuite d’études (complément)","titre":"Produit scalaire de deux vecteurs","portee":{"poursuite":true},"objectifs":[{"id":"bpt.scal.o1","txt":"Utiliser les trois expressions du produit scalaire de deux vecteurs pour déterminer des longueurs et des angles.","comp":["real"]},{"id":"bpt.scal.o2","txt":"Reconnaître des vecteurs orthogonaux, à l’aide de leurs coordonnées dans un repère orthonormé.","comp":["sapp"]}],"connaissances":[{"id":"bpt.scal.k1","txt":"Définition du produit scalaire de deux vecteurs du plan rapporté à un repère orthonormé.","sous":[]},{"id":"bpt.scal.k2","txt":"Propriétés du produit scalaire de deux vecteurs","sous":["u⃗ ⋅ v⃗ = v⃗ ⋅ u⃗ α ( u⃗ ⋅ v⃗ ) = (α u⃗ ) ⋅ v⃗ u⃗ ⋅ ( v⃗ + w⃗⃗ ) = u⃗ ⋅ v⃗ + u⃗ ⋅ w⃗⃗ Vecteurs orthogonaux : deux vecteurs u⃗ et v⃗ sont orthogonaux si et seulement si leur produit scalaire est nul"]}],"bo":{"commentaires":["− Le produit scalaire de deux vecteurs du plan rapporté à un repère orthonormé est","défini par l’une des trois expressions suivantes ; les deux autres sont admises :","- u⃗ ⋅ v⃗ = 1 (‖u⃗ + v⃗ ‖2 - ‖u⃗ ‖2 - ‖v⃗ ‖2) ;","2","- Si u⃗ ou v⃗ est nul alors u⃗ ⋅ v⃗ = 0. Si u⃗ et v⃗ sont tous les deux différents du","vecteur nul alors u⃗ ⋅ v⃗ = ‖u⃗ ‖ × ‖v⃗ ‖ × cos θ avec θ = ( u⃗ ,v⃗ ). La notion d’angle","orienté de vecteurs est abordée de façon intuitive.","- Si les vecteurs u⃗ et v⃗ ont pour coordonnées respectives (x,y) et (x’,y’ ) alors","u⃗ ⋅ v⃗ = xx’ + yy’."]}}],"automatismes":[{"id":"bpt.a1","txt":"Calcul de la probabilité : d’un événement, de l’événement contraire Ā connaissant celle de l’événement A.","groupe":"Tous"},{"id":"bpt.a2","txt":"Calcul de la probabilité de la réunion d’événements incompatibles.","groupe":"Tous"},{"id":"bpt.a3","txt":"Calcul de la probabilité de la réunion de deux événements.","groupe":"Tous"},{"id":"bpt.a4","txt":"Calcul de la probabilité de l’intersection de deux événements.","groupe":"Tous"},{"id":"bpt.a5","txt":"Exploitation de représentations de données : tableaux croisés d’effectifs, diagrammes.","groupe":"Tous"},{"id":"bpt.a6","txt":"Calcul de probabilités conditionnelles.","groupe":"Tous"},{"id":"bpt.a7","txt":"Calcul du terme de rang donné d’une suite arithmétique dont le premier terme et la raison sont donnés.","groupe":"Tous"},{"id":"bpt.a8","txt":"Visualisation, à partir de la représentation graphique donnée d’une fonction polynôme ƒ de degré 2, du nombre possible de solution(s) de l’équation ƒ(x) = 0.","groupe":"Tous"},{"id":"bpt.a9","txt":"Écriture de la forme factorisée d’un polynôme de degré 2 dont les racines et le coefficient dominant sont connus.","groupe":"Tous"},{"id":"bpt.a10","txt":"Utilisation des formules et des règles de dérivation pour déterminer la dérivée d’une fonction polynôme de degré inférieur ou égal à 2.","groupe":"Tous"},{"id":"bpt.a11","txt":"Construction d’un vecteur du plan2 obtenu comme : 2 Cet automatisme n’est à tester que dans les classes préparant à un baccalauréat du groupement A ou du groupement B.","groupe":"Tous"}],"vocabulaire":["L’apprentissage des notations mathématiques, de la logique et des raisonnements est transversal à tous les chapitres du programme des trois années de formation. Aussi, il importe de les travailler d’abord dans des contextes où ils se présentent naturellement, puis de prévoir des moments pour effectuer une synthèse de certains concepts ou une explicitation de types de raisonnement, après que ceux-ci ont été rencontrés plusieurs fois en situation.","Les élèves doivent connaître les notions d’élément d’un ensemble, de sous-ensemble, d’appartenance et d’inclusion, de réunion, d’intersection et de complémentaire et savoir utiliser les symboles de base correspondant : ∈, ⊂, ⋂, ⋃, ainsi que la notation des ensembles de nombres et des intervalles du type [ a ; b ] , ] a ; b [ , [ a ; b [ , ] a ; b ] avec a et b réels. Ils rencontrent également la notion de couple.","Pour le complémentaire d’un sous-ensemble A de E, on utilise la notation des probabilités Ā. Pour ce qui concerne le raisonnement logique, les élèves rencontrent à la faveur","d’exemples :","− les connecteurs logiques « et », « ou » ;","− le quantificateur « quel que soit » et le quantificateur « il existe » (les symboles ∀ et ∃","sont hors programme) ;","− des implications et équivalences logiques ;","− la réciproque d’une implication ;","−
