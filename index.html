<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches — séances et séquences de maths</title>
<meta name="description" content="Préparez vos séances et séquences de maths (3PM, CAP, Bac Pro) à partir des programmes officiels ; la progression se remplit automatiquement.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2B4C7E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiches">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Fiches — palette calme (marine / ardoise), aucun néon, aucune ressource externe */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--surface2:#EAEEF5;--text:#1B2438;--muted:#5C677D;--line:#D5DBE6;
  --primary:#2B4C7E;--primary-d:#223C64;--on-primary:#FFFFFF;--accent:#3B7C8F;--warn:#9A5F2A;--warn-bg:#F7EEE3;--err:#9C3F4A;--err-bg:#F6E7E9;--ok:#3F7A5C;--ok-bg:#E5F1EA;
  --s0:#B9C2D3;--s1:#C9A24B;--s2:#5B8FB0;--s3:#3F7A5C;
  --shadow:0 1px 2px rgba(27,36,56,.06),0 4px 14px rgba(27,36,56,.06);--r:12px;--rs:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12182A;--surface:#1A2238;--surface2:#232C46;--text:#E4E9F4;--muted:#9AA6C0;--line:#2F3A58;
  --primary:#7FA3D6;--primary-d:#9AB8E2;--on-primary:#0F1730;--accent:#6DAABB;--warn:#D4A06A;--warn-bg:#322A21;--err:#D98A94;--err-bg:#34242A;--ok:#7FBF9D;--ok-bg:#213429;
  --s0:#44506D;--s1:#B08F40;--s2:#5B8FB0;--s3:#5E9E7C;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12182A;--surface:#1A2238;--surface2:#232C46;--text:#E4E9F4;--muted:#9AA6C0;--line:#2F3A58;
  --primary:#7FA3D6;--primary-d:#9AB8E2;--on-primary:#0F1730;--accent:#6DAABB;--warn:#D4A06A;--warn-bg:#322A21;--err:#D98A94;--err-bg:#34242A;--ok:#7FBF9D;--ok-bg:#213429;
  --s0:#44506D;--s1:#B08F40;--s2:#5B8FB0;--s3:#5E9E7C;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--primary)}h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:1.5rem}h2{font-size:1.1rem;margin-bottom:.5rem}h3{font-size:1rem;margin:1rem 0 .3rem}
p{margin:.4rem 0 .6rem}ul,ol{margin:.3rem 0 .6rem;padding-left:1.3rem}
.muted{color:var(--muted)}.small{font-size:.85rem}.center{text-align:center}.grow{flex:1}
button{font:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}

/* coque */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;color:var(--text);text-decoration:none;font-size:1.05rem}
.logo{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--primary);color:var(--on-primary);font-size:1rem}
.sync{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:.2rem .7rem;font-size:.8rem;cursor:pointer}
.sync.ok{color:var(--ok)}.sync.warn,.sync.pend{color:var(--warn);background:var(--warn-bg)}.sync.err{color:var(--err);background:var(--err-bg)}
.icon-btn{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:var(--rs);min-width:36px;height:36px;cursor:pointer;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface2);color:var(--text)}.icon-btn.sm{min-width:30px;height:30px;font-size:.85rem}
.body{display:flex;min-height:calc(100vh - 54px)}
.nav{width:190px;flex:none;padding:.8rem .6rem;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.15rem;position:sticky;top:54px;align-self:flex-start;height:calc(100vh - 54px)}
.nav a{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:var(--rs);color:var(--text);text-decoration:none;font-size:.95rem}
.nav a:hover{background:var(--surface2)}.nav a.on{background:var(--primary);color:var(--on-primary)}
.nav .ic{width:1.4rem;text-align:center}
#view{flex:1;min-width:0;outline:none}
.page{max-width:1000px;margin:0 auto;padding:1rem 1rem 5rem}.page.narrow{max-width:720px}
.page-head{margin-bottom:.8rem}.back{display:inline-block;margin-bottom:.3rem;font-size:.9rem;text-decoration:none}
.ph-row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:flex-end}
.ph-actions{display:flex;flex-wrap:wrap;gap:.4rem}
@media (max-width:760px){
  .body{display:block}
  .nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding:.2rem .3rem calc(.2rem + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30}
  .nav a{flex-direction:column;gap:0;padding:.3rem .1rem;font-size:.62rem;text-align:center;flex:1;min-width:0;overflow:hidden}.nav .t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav .ic{font-size:1.15rem}
  .page{padding:.8rem .8rem 6rem}
}

/* composants */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin:0 0 .9rem;box-shadow:var(--shadow)}
.card.hero{text-align:center;padding:2rem 1rem}.card.warnbox{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.card.info-card{background:var(--surface2)}
.card.sec{padding:0}.card.sec>summary{list-style:none;cursor:pointer;padding:.8rem 1rem;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.card.sec>summary::-webkit-details-marker{display:none}.card.sec>summary::before{content:"▸";margin-right:.5rem;color:var(--muted);transition:transform .15s}
.card.sec[open]>summary::before{transform:rotate(90deg)}.card.sec>summary .sec-t{flex:1}
.sec-b{padding:0 1rem 1rem}
.prose h3{color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.5rem .9rem;min-height:40px;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;font-size:.92rem}
.btn:hover{background:var(--surface2)}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}.btn.primary:hover{background:var(--primary-d)}
.btn.ghost{background:transparent}.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,var(--line))}.btn.danger:hover{background:var(--err-bg)}
.btn.small{min-height:34px;padding:.3rem .65rem;font-size:.85rem}.btn.wide{width:100%}.btn[disabled]{opacity:.55;cursor:default}
.linklike{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;text-align:left;text-decoration:underline}
.inp{width:100%;padding:.5rem .65rem;min-height:40px;border:1px solid var(--line);border-radius:var(--rs);background:var(--surface);color:var(--text);font:inherit}
textarea.inp{resize:vertical;min-height:2.6rem;line-height:1.45}select.inp{padding-right:1.4rem}
.inp.sm{min-height:32px;padding:.2rem .45rem;width:auto;font-size:.88rem}.inp.num{width:5.5rem}
.field{display:block;margin:.5rem 0}.lbl{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:.2rem}.hint{display:block;font-size:.8rem;color:var(--muted);margin-top:.2rem}
.check{display:flex;align-items:flex-start;gap:.5rem;margin:.4rem 0;cursor:pointer}.check input{margin-top:.3rem;width:1.05rem;height:1.05rem}.check.big{font-weight:600}
.grid2,.grid3,.grid4,.two{display:grid;gap:.2rem .8rem}.grid2,.two{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){.grid2,.two,.grid3,.grid4{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
.row-gap{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .7rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);font-size:.85rem;cursor:pointer;text-decoration:none;min-height:32px}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
span.chip{cursor:default;min-height:0;padding:.1rem .55rem;font-size:.78rem}
.chip.st-faite,.chip.st-prete{background:var(--ok-bg);color:var(--ok);border-color:transparent}.chip.st-en_cours{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.cal-vacances{background:var(--surface2)}.chip.cal-pfmp{background:var(--warn-bg);color:var(--warn)}.chip.cal-examen{background:var(--err-bg);color:var(--err)}
.badge{background:var(--surface2);color:var(--muted);border-radius:999px;padding:.05rem .55rem;font-size:.78rem;font-weight:600}
.tag{font-style:normal;font-size:.7rem;background:var(--surface2);color:var(--muted);border-radius:6px;padding:.05rem .4rem;margin-left:.35rem;vertical-align:middle}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.cls-chip{display:inline-block;padding:.05rem .55rem;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.warnt{color:var(--warn)}.err-t{color:var(--err)}
.sub-h{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:1rem 0 .4rem}

/* connexion */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:1rem}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.5rem;box-shadow:var(--shadow)}
.auth-logo{width:52px;height:52px;border-radius:14px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:1.6rem;margin-bottom:.5rem}
.auth-msg{min-height:1.3rem;font-size:.88rem;color:var(--err);margin:.4rem 0}.auth-msg.ok{color:var(--ok)}
.auth-links{display:flex;justify-content:space-between;margin:.6rem 0}
.boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:.6rem;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.public{max-width:760px;margin:0 auto}.errpre{white-space:pre-wrap;text-align:left;background:var(--surface2);padding:.6rem;border-radius:var(--rs)}

/* tableau de bord, classes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.cls-card{display:block;text-decoration:none;color:var(--text);border-top:5px solid var(--primary)}.cls-card:hover{background:var(--surface2)}.cls-card.archived{opacity:.6}
.cls-t{font-weight:700;font-size:1.05rem}.sec-h{margin:1.2rem 0 .5rem}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:.5rem 0;position:relative;display:flex}.bar i{display:block;height:100%;background:var(--primary)}
.bar.sm{width:90px;height:6px;margin:0 .5rem;flex:none}.bar.sm i.v{background:var(--s3)}.bar.sm i.p{background:var(--s1)}
.row-s{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;padding:.45rem 0;border-top:1px solid var(--line)}.row-s:first-of-type{border-top:0}
.row-t{flex:1;min-width:150px;font-weight:600;color:var(--text);text-decoration:none}a.row-t:hover{text-decoration:underline}
.day-h{font-size:.8rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin:.7rem 0 .1rem}
.seq-row{display:flex;align-items:center;gap:.6rem;padding:.55rem .4rem;border:1px solid var(--line);border-radius:var(--rs);margin:.35rem 0;background:var(--surface)}
.seq-main{flex:1;min-width:0}.seq-t{font-weight:600;color:var(--text);text-decoration:none}.seq-t:hover{text-decoration:underline}
.grip{cursor:grab;color:var(--muted);padding:.2rem .35rem;touch-action:none;user-select:none;font-size:1.1rem}
.sort-item.dragging{opacity:.65;box-shadow:var(--shadow);background:var(--surface2)}
.cal-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.3rem 0;border-top:1px solid var(--line)}.cal-l{flex:1;min-width:140px}
.cren-row{display:flex;align-items:center;gap:.4rem;margin:.3rem 0;flex-wrap:wrap}
.swatches{display:flex;gap:.4rem;flex-wrap:wrap}.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.on{border-color:var(--text)}
.form .field:first-child{margin-top:0}
.totals{font-size:.88rem;color:var(--muted);margin:.5rem 0}

/* sélecteur à accordéons */
.picker{border:1px solid var(--line);border-radius:var(--r);padding:.6rem;background:var(--surface2)}
.pk-tools{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.5rem}.pk-search{flex:1;min-width:180px}
.pk-dom,.pk-hors{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);margin:.4rem 0}
.pk-dom>summary,.pk-hors>summary{padding:.6rem .8rem;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:.5rem;list-style:none}
.pk-dom>summary::-webkit-details-marker,.pk-hors>summary::-webkit-details-marker,.pk-chap>summary::-webkit-details-marker{display:none}
.pk-dom>summary::before,.pk-hors>summary::before,.pk-chap>summary::before{content:"▸";margin-right:.5rem;color:var(--muted)}
.pk-dom[open]>summary::before,.pk-hors[open]>summary::before,.pk-chap[open]>summary::before{content:"▾"}
.pk-dom>summary span:first-child{flex:1}
.pk-chap{border-top:1px solid var(--line)}.pk-chap>summary{padding:.55rem .8rem;cursor:pointer;display:flex;align-items:center;gap:.5rem;list-style:none}
.pk-ct{flex:1;font-weight:600}.pk-count{font-size:.78rem;color:var(--muted);background:var(--surface2);padding:.05rem .5rem;border-radius:99px;white-space:nowrap}.pk-count.on{background:var(--primary);color:var(--on-primary)}
.pk-chap-b{padding:.2rem .8rem .8rem}.pk-grp{margin:.5rem 0}.pk-gt{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:.5rem 0 .2rem}
.pk-row{display:flex;gap:.4rem;align-items:flex-start;padding:.25rem .3rem;border-radius:6px}.pk-row:hover{background:var(--surface2)}.pk-row.on{background:color-mix(in srgb,var(--primary) 12%,transparent)}
.pk-row label{display:flex;gap:.55rem;align-items:flex-start;flex:1;cursor:pointer;font-size:.93rem}.pk-row input{margin-top:.28rem;width:1.05rem;height:1.05rem;flex:none}
.pk-act{display:flex;gap:.1rem;flex:none}.pk-addbox{display:flex;gap:.3rem;margin-top:.4rem}.pk-add{flex:1}
.pk-bo{font-size:.83rem;color:var(--muted);margin-top:.6rem}.pk-bo summary{cursor:pointer}
.pk-hors{border-style:dashed}.pk-hors>p{padding:0 .8rem}
.pk-list{max-height:none}
@media (min-width:900px){.pk-list{max-height:70vh;overflow:auto}}

/* éléments choisis, compétences */
.ch-grp{margin:.4rem 0}.ch-t{font-weight:700;font-size:.9rem;color:var(--primary);margin-bottom:.15rem}
.ch-row{display:flex;gap:.5rem;align-items:center;padding:.25rem 0;border-top:1px dashed var(--line)}.ch-txt{flex:1;font-size:.9rem}
.kind{font-size:.68rem;font-weight:700;text-transform:uppercase;border-radius:6px;padding:.05rem .4rem;background:var(--surface2);color:var(--muted);flex:none}
.kind.k-o{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}.kind.k-a{background:var(--ok-bg);color:var(--ok)}
.comp-box{margin:.8rem 0}.comp-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.comps{display:flex;flex-wrap:wrap;gap:.4rem}.comp{border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:.25rem .8rem;cursor:pointer;font-size:.85rem}
.caps{margin-top:.5rem;font-size:.86rem}.caps summary{cursor:pointer;color:var(--muted)}.cap-row{display:flex;gap:.5rem;align-items:flex-start;padding:.2rem 0}.dot{width:10px;height:10px;border-radius:50%;margin-top:.4rem;flex:none}
.phase{display:flex;gap:.4rem;border:1px solid var(--line);border-radius:var(--rs);padding:.4rem;margin:.35rem 0;background:var(--surface)}
.ph-body{flex:1;min-width:0}.ph-top{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.3rem}
.ev-row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:.3rem 0}.ev-row .inp:first-child{flex:1;min-width:160px}
.action-bar{display:flex;justify-content:flex-end;gap:.5rem;margin:1.2rem 0}
.date-hint{min-height:1.1rem}

/* ressources */
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:.9rem;text-align:center;background:var(--surface2);transition:.15s}
.dropzone.over{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface2))}.dropzone.big{padding:1.4rem;margin:.6rem 0}
.dz-btns{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-top:.5rem}
.res-list{margin-top:.6rem}.res-row{display:flex;gap:.6rem;align-items:center;padding:.4rem 0;border-top:1px solid var(--line)}.res-main{flex:1;min-width:0;word-break:break-word}.res-ic{font-size:1.2rem;flex:none}.res-ic.big{font-size:1.7rem}
.res-act{display:flex;gap:.2rem}.lib-pick{max-height:50vh;overflow:auto;margin-top:.5rem}.lib-row{display:flex;gap:.8rem;align-items:flex-start;padding:.7rem 1rem;margin:.4rem 0}
.gauge{display:flex;align-items:center;gap:.7rem;margin:.4rem 0}.gauge .bar{flex:1;max-width:260px;margin:0}

/* progression */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin:.8rem 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.6rem .8rem}.stat-v{font-size:1.35rem;font-weight:700;color:var(--primary)}.stat-l{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);margin:.8rem 0;overflow:auto}.tab{border:0;background:none;padding:.6rem .9rem;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}.tab.on{color:var(--primary);border-color:var(--primary);font-weight:700}
.pg-dom h2{color:var(--primary)}.pg-chap{border-top:1px solid var(--line)}.pg-chap>summary{padding:.55rem 0;cursor:pointer;display:flex;align-items:center;gap:.4rem;list-style:none}
.pg-body{padding:0 0 .6rem}.pg-row{display:flex;gap:.6rem;align-items:flex-start;padding:.3rem 0;border-top:1px dashed var(--line)}.pg-main{flex:1;min-width:0}.pg-txt{font-size:.92rem}
.st-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--s0);background:var(--surface);color:var(--muted);cursor:pointer;flex:none;font-size:1rem;line-height:1}
.st-btn.s1{border-color:var(--s1);background:conic-gradient(var(--s1) 0 25%,transparent 0)}.st-btn.s2{border-color:var(--s2);background:conic-gradient(var(--s2) 0 50%,transparent 0)}.st-btn.s3{background:var(--s3);border-color:var(--s3)}.st-btn.s3::after{content:'✓';color:#fff;font-weight:700}.st-btn.plan{border-style:dashed;border-color:var(--s1)}
.legend{display:flex;flex-wrap:wrap;gap:.8rem;font-size:.8rem;color:var(--muted)}.lg i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--s0);vertical-align:-2px;margin-right:.15rem}.lg i.s1{border-color:var(--s1);background:conic-gradient(var(--s1) 0 25%,transparent 0)}.lg i.s2{border-color:var(--s2);background:conic-gradient(var(--s2) 0 50%,transparent 0)}.lg i.s3{background:var(--s3);border-color:var(--s3)}.lg i.plan{border-style:dashed;border-color:var(--s1)}
.cal-grid{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cal-wk{display:grid;grid-template-columns:130px 1fr 110px;gap:.6rem;padding:.45rem .8rem;border-top:1px solid var(--line);align-items:start}.cal-wk:first-child{border-top:0}
.cal-wk.off{background:var(--surface2)}.cal-wk.now{box-shadow:inset 4px 0 0 var(--primary)}.cal-d{font-size:.85rem;font-weight:600}.cal-m{text-align:right}
.cal-c{display:flex;flex-wrap:wrap;gap:.3rem}.cal-ev{font-size:.8rem;padding:.1rem .5rem;border-radius:6px;background:var(--surface2);color:var(--text);text-decoration:none;border:1px solid var(--line)}
.cal-ev.st-faite{background:var(--ok-bg);color:var(--ok)}.cal-ev.st-prete{background:color-mix(in srgb,var(--primary) 12%,transparent)}
@media (max-width:760px){.cal-wk{grid-template-columns:1fr}.cal-m{text-align:left}}
ul.plain{padding-left:1.1rem;font-size:.9rem}

/* modales, toasts, installation */
.modal-back{position:fixed;inset:0;background:rgba(10,16,32,.55);display:grid;place-items:center;padding:1rem;z-index:100}
.modal{width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.modal.wide{width:min(820px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line)}.modal-body{padding:1rem;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--line)}
.toasts{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:.4rem;z-index:200;pointer-events:none}
@media (min-width:761px){.toasts{bottom:1.2rem}}
.toast{background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:10px;max-width:min(520px,92vw);box-shadow:var(--shadow);transition:.3s;font-size:.9rem}.toast.err{background:var(--err);color:#fff}.toast.out{opacity:0;transform:translateY(8px)}
.install-bar{position:fixed;left:.6rem;right:.6rem;bottom:calc(72px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.6rem .8rem;box-shadow:var(--shadow)}
@media (min-width:761px){.install-bar{left:auto;right:1rem;bottom:1rem;max-width:520px}}

/* impression */
#print-root{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body.printing{background:#fff;color:#000}
  body.printing #app,body.printing .toasts,body.printing .modal-back,body.printing .install-bar{display:none!important}
  body.printing #print-root{display:block}
  #print-root .doc{font:10.5pt/1.4 Calibri,Arial,sans-serif;color:#000}
  #print-root h1{font-size:17pt;color:#1F3A66;margin:0 0 3pt}#print-root h3{font-size:11.5pt;color:#1F3A66;border-bottom:1px solid #9AA8C0;margin:11pt 0 3pt;break-after:avoid}
  #print-root table{border-collapse:collapse;width:100%;break-inside:auto}#print-root tr{break-inside:avoid}
  #print-root th,#print-root td{border:1px solid #9AA8C0;padding:2pt 5pt;vertical-align:top;text-align:left}#print-root th{background:#E6EBF4}
  #print-root .meta,#print-root .small,#print-root .niv{color:#555}#print-root .small{font-size:8.5pt}
  #print-root table.prog td{border:0;border-bottom:1px solid #E1E6EF}#print-root td.st{width:60pt;color:#555;font-size:8.5pt}
  #print-root ul{margin:2pt 0 4pt;padding-left:16pt}
}

t d'économiser 55 € par an en installant un récupérateur d'eau de pluie. Le récupérateur a coûté 199 € à l’achat et va nécessiter chaque année 13 € pour l'entretien (nettoyage, tuyau…). Au bout de combien d'années l’installation sera-t-elle rentable ? 2 2 2 2 2  Ce que sait faire l’élève  Type d’exercice  Exemple d’énoncé Indication générale"],"attendu":"Utiliser le calcul littéral"}},{"id":"pm.B5","domaine":"Thème B – Organisation et gestion de données, fonctions","titre":"Statistiques : interpréter, représenter, traiter des données","portee":{},"objectifs":[{"id":"pm.B5.o1","txt":"Lire, interprète et représenter des données sous forme d’histogrammes pour des classes de même amplitude.","comp":["repr"]},{"id":"pm.B5.o2","txt":"Calculer et interpréter l’étendue d’une série présentée sous forme de données brutes, d’un tableau, d’un diagramme en bâtons, d’un diagramme circulaire ou d’un histogramme.","comp":["calc"]},{"id":"pm.B5.o3","txt":"Calculer des effectifs et des fréquences.","comp":["calc"]}],"connaissances":[],"bo":{"exemples":[],"attendu":"Interpréter, représenter et traiter"}},{"id":"pm.B6","domaine":"Thème B – Organisation et gestion de données, fonctions","titre":"Notions élémentaires de probabilités","portee":{},"objectifs":[{"id":"pm.B6.o1","txt":"À partir de dénombrements, il calcule des probabilités pour des expériences aléatoires simples à une ou deux épreuves.","comp":["real"]},{"id":"pm.B6.o2","txt":"Faire le lien entre stabilisation des fréquences et probabilités.","comp":["real"]}],"connaissances":[],"bo":{"exemples":["On donne les fréquences d’apparition de chaque face d’un dé pour 10 000 lancers. L’élève interprète les résultats en les comparant aux probabilités théoriques.","L’élève interprète des simulations effectuées sur tableur ou logiciel de programmation en fonction d’un nombre de lancers."],"attendu":"Comprendre et utiliser des notions élémentaires de probabilités"}},{"id":"pm.B7","domaine":"Thème B – Organisation et gestion de données, fonctions","titre":"Proportionnalité","portee":{},"objectifs":[{"id":"pm.B7.o1","txt":"Modéliser une situation de proportionnalité à l’aide d’une fonction linéaire.","comp":["mod"]},{"id":"pm.B7.o2","txt":"Utiliser le lien entre pourcentage d’évolution et coefficient multiplicateur.","comp":["calc"]},{"id":"pm.B7.o3","txt":"Résoudre des problèmes en utilisant la proportionnalité dans le cadre de la géométrie.","comp":["calc"]}],"connaissances":[],"bo":{"exemples":["Un mobile se déplace à 5 m/s. L’élève modélise la situation par d(x) = 5x où x est le temps exprimé en secondes et d(x) la distance parcourue, en mètres, en x secondes.","Il sait qu’une augmentation de 5 % se traduit par une multiplication par 1,05.","Il sait qu’une diminution de 20 % se traduit par une multiplication par 0,8.","Il utilise la proportionnalité pour calculer des longueurs dans une configuration de Thalès, dans des triangles semblables, dans le cadre des homothéties."],"attendu":"Résoudre des problèmes de proportionnalité"}},{"id":"pm.B8","domaine":"Thème B – Organisation et gestion de données, fonctions","titre":"Notion de fonction","portee":{},"objectifs":[{"id":"pm.B8.o1","txt":"Utiliser les notations et le vocabulaire fonctionnels.","comp":["calc"]},{"id":"pm.B8.o2","txt":"Passer d’un mode de représentation d’une fonction à un autre.","comp":["real"]},{"id":"pm.B8.o3","txt":"Déterminer, à partir de tous les modes de représentation, l’image d’un nombre.","comp":["calc"]},{"id":"pm.B8.o4","txt":"Déterminer un antécédent à partir d‘une représentation graphique ou d’un tableau de valeurs d’une fonction.","comp":["calc"]},{"id":"pm.B8.o5","txt":"Déterminer de manière algébrique l’antécédent par une fonction, dans des cas se ramenant à la résolution d’une équation du premier degré.","comp":["calc"]},{"id":"pm.B8.o6","txt":"Représenter graphiquement une fonction linéaire, une fonction affine.","comp":["repr"]},{"id":"pm.B8.o7","txt":"Interpréter les paramètres d’une fonction affine suivant l’allure de sa courbe représentative.","comp":["comm"]},{"id":"pm.B8.o8","txt":"Modéliser un phénomène continu par une fonction.","comp":["mod"]},{"id":"pm.B8.o9","txt":"Modéliser une situation de proportionnalité à l’aide d’une fonction linéaire.","comp":["mod"]},{"id":"pm.B8.o10","txt":"Résoudre des problèmes modélisés par des fonctions en utilisant un ou plusieurs modes de représentation.","comp":["calc"]}],"connaissances":[],"bo":{"exemples":["Il comprend les notations f : x  3x 2  7 et f(x) = 3x - 7. Il sait alors que x est la variable et f la fonction.","Il sait que g(3) = 15 signifie que 15 est l’image de 3 par la fonction g et que 3 est un antécédent de 15 par la fonction g.","Il détermine l’image d’un nombre par une fonction à partir de son expression symbolique, de sa représentation graphique, d’un tableau de valeurs, d’un programme de calcul.  Détermine à l’aide d’une équation : - l’antécédent de 10 par la fonction f définie par f(x) = -3x - 4 ; - les antécédents de 0 par la fonction g définie par g(x) = (3x + 6)(x - 9).","Il représente graphiquement les fonctions f : x  5x  1 et g : x  3x .","À partir de l’allure de la représentation graphique d’une fonction affine, il détermine le signe du coefficient directeur et de l’ordonnée à l’origine.  Complète : l’aire d’un rectangle dont le périmètre est égal à 30 cm et dont un côté a pour longueur x est donné par la fonction A : x  …………………..","Un mobile se déplace à 5 m/s. L’élève modélise la situation par la fonction f définie par f(x) = 5x où x est le temps exprimé en secondes et f(x) la distance parcourue, en mètres, en x secondes.  On enlève quatre carrés identiques aux quatre coins d'un rectangle de 20 cm de longueur et 13 cm de largeur. Détermine la longueur du côté de ces carrés qui correspond à une aire restante de 208,16 cm², par la méthode de ton choix.  Ce que sait faire l’élève  Type d’exercice  Exemple d’énoncé Indication générale"],"attendu":"Comprendre et utiliser la notion de fonction"}},{"id":"pm.C9","domaine":"Thème C – Grandeurs et mesures","titre":"Grandeurs mesurables et unités","portee":{},"objectifs":[{"id":"pm.C9.o1","txt":"Calculer le volume d’une boule.","comp":["calc"]},{"id":"pm.C9.o2","txt":"Calculer les volumes d’assemblages de solides étudiés au cours du cycle.","comp":["calc"]},{"id":"pm.C9.o3","txt":"L’élève mène des calculs sur des grandeurs mesurables, notamment des grandeurs composées, et exprime les résultats dans les unités adaptées.","comp":["real"]},{"id":"pm.C9.o4","txt":"Résoudre des problèmes utilisant les conversions d’unités sur des grandeurs composées.","comp":["calc"]},{"id":"pm.C9.o5","txt":"Vérifier la cohérence des résultats du point de vue des unités pour les calculs de grandeurs simples ou composées.","comp":["real"]}],"connaissances":[],"bo":{"exemples":["Il calcule le volume d’un cylindre surmonté d’une demi-boule de même diamètre.","Il calcule le volume restant dans cette boîte cylindrique de hauteur 30 cm dans laquelle 3 boules identiques de rayon 5 cm ont été placées comme indiqué dans le schéma ci-contre :  Un conducteur met 1 s avant de commencer à freiner quand il voit un obstacle. Quelle distance parcourt-il pendant cette durée s’il roule à 80 km/h ?  Le débit moyen de la Seine sous le pont de l’Alma est 328 m /s. Combien de litres d’eau sontils passés sous ce pont en 3 min ?","Il oralise que les durées sont en heures, minutes, secondes, les longueurs en mètres, les aires en mètres carrés et les volumes en mètres cubes, les vitesses en kilomètres par heure ou en mètres par seconde, les débits en mètres cubes par seconde ou litres par heure… 3"],"attendu":"Calculer avec des grandeurs mesurables"}},{"id":"pm.D10","domaine":"Thème D – Espace et géométrie","titre":"Transformations (symétries, translations, homothéties, rotations)","portee":{},"objectifs":[{"id":"pm.D10.o1","txt":"Calculer des grandeurs géométriques (longueurs, aires et volumes) en utilisant les transformations (symétries, rotations, translations, homothétie).","comp":["calc"]},{"id":"pm.D10.o2","txt":"Résoudre des problèmes en utilisant la proportionnalité en géométrie dans le cadre de certaines configurations ou transformations (agrandissement, réduction, triangles semblables, homothéties).","comp":["calc"]}],"connaissances":[],"bo":{"exemples":["Il détermine des longueurs, des aires, des mesures d’angles et des volumes en utilisant les propriétés de conservation des symétries (axiale et centrale), d’une translation, d’une rotation.","Dans une homothétie de rapport k, il calcule des longueurs, des aires et des volumes. Par exemple, il est capable de calculer l’aire de la figure obtenue dans une homothétie de rapport k (k non nul) connaissant l’aire de la figure initiale.","À partir d’un schéma tel que celui ci-contre, il calcule des longueurs de carrés connaissant les longueurs d’un des carrés et le rapport de l’homothétie correspondante.  Ce que sait faire l’élève  Type d’exercice  Exemple d’énoncé Indication générale"],"attendu":"Comprendre l’effet de quelques transformations"}},{"id":"pm.D11","domaine":"Thème D – Espace et géométrie","titre":"Représenter l’espace (solides, sections)","portee":{},"objectifs":[{"id":"pm.D11.o1","txt":"L’élève se repère sur une sphère (latitude, longitude).","comp":["real"]},{"id":"pm.D11.o2","txt":"Construire et mettre en relation différentes représentations des solides étudiés au cours du cycle (représentations en perspective cavalière, vues de face, de dessus, en coupe, patrons) et leurs sections planes.","comp":["repr"]}],"connaissances":[],"bo":{"exemples":["Il pointe Paris et Sidney sur un globe terrestre à partir de leurs latitudes et longitudes.","Il reconnaît un grand cercle sur une sphère.","Il trace des solides en perspective cavalière et fait apparaître des sections."],"attendu":"Représenter l’espace"}},{"id":"pm.D12","domaine":"Thème D – Espace et géométrie","titre":"Géométrie plane et démonstration (Pythagore, Thalès, trigonométrie)","portee":{},"objectifs":[{"id":"pm.D12.o1","txt":"À partir des connaissances suivantes : - le théorème de Thalès et sa réciproque dans la configuration papillon ; - les triangles semblables : une définition et une propriété caractéristique ; - les lignes trigonométriques dans le triangle rectangle : cosinus, sinus, tangente, il transforme une figure par rotation et par homothétie et il comprend l’effet d’une rotation et d’une homothétie.","comp":["real"]},{"id":"pm.D12.o2","txt":"Identifier des rotations et des homothéties dans des frises, des pavages et des rosaces.","comp":["rais"]},{"id":"pm.D12.o3","txt":"Mobiliser les connaissances des figures, des configurations, de la rotation et de l’homothétie pour déterminer des grandeurs géométriques.","comp":["real"]},{"id":"pm.D12.o4","txt":"L’élève mène des raisonnements en utilisant des propriétés des figures, des configurations, de la rotation et de l’homothétie.","comp":["real"]}],"connaissances":[],"bo":{"exemples":["Il réalise (à la main, à l’aide d’un logiciel de géométrie dynamique ou de programmation) la figure suivante obtenue à partir du triangle ABC par des rotations successives de centre A et d’angle 60°.","Il justifie que la figure précédente est composée de 6 triangles rectangles.","Il réalise (à la main, à l’aide d’un logiciel de géométrie dynamique ou de programmation) la figure suivante à l’aide du quadrilatère ABCD et deux homothéties de centre O et de rapports 3 et -0,5.","Il justifie la nature des trois quadrilatères en s’appuyant sur le codage et sur les propriétés de conservations des homothéties.","Il décrit les transformations permettant de construire la rosace suivante :","Il détermine l’aire totale des figures construites ci-dessous connaissant les longueurs AB et BC pour la première et la longueur AB pour la seconde."],"attendu":"Utiliser les notions de géométrie plane pour démontrer"}},{"id":"pm.E13","domaine":"Thème E – Algorithmique et programmation","titre":"Algorithmique et programmation","portee":{},"objectifs":[{"id":"pm.E13.o1","txt":"[Niveau 1] Réaliser des activités d’algorithmique débranchée.","comp":["real"]},{"id":"pm.E13.o2","txt":"[Niveau 1] Mettre en ordre et/ou compléter des blocs fournis par le professeur pour construire un programme simple sur un logiciel de programmation.","comp":["calc"]},{"id":"pm.E13.o3","txt":"[Niveau 1] Écrire un script de déplacement ou de construction géométrique utilisant des instructions conditionnelles et/ou la boucle « Répéter … fois ».","comp":["calc"]},{"id":"pm.E13.o4","txt":"[Niveau 2] Gérer le déclenchement d'un script en réponse à un événement.","comp":["real"]},{"id":"pm.E13.o5","txt":"[Niveau 2] Écrire une séquence d’instructions (condition « si … alors » et boucle « répéter … fois »).","comp":["calc"]},{"id":"pm.E13.o6","txt":"[Niveau 2] Intégrer une variable dans un programme de déplacement, de construction géométrique ou de calcul.","comp":["real"]},{"id":"pm.E13.o7","txt":"[Niveau 3] Décomposer un problème en sous-problèmes et traduire un sous-problème en créant un « bloc-personnalisé ».","comp":["cher"]},{"id":"pm.E13.o8","txt":"[Niveau 3] Construire une figure en créant un motif et en le reproduisant à l’aide d’une boucle.","comp":["repr"]},{"id":"pm.E13.o9","txt":"[Niveau 3] Utiliser simultanément les boucles « Répéter … fois » et « Répéter jusqu’à … » ainsi que les instructions conditionnelles pour réaliser des figures, des programmes de calculs, des déplacements, des simulations d’expérience aléatoire.","comp":["calc"]},{"id":"pm.E13.o10","txt":"[Niveau 3] Écrire plusieurs scripts fonctionnant en parallèle pour gérer des interactions et créer des jeux.","comp":["calc"]}],"connaissances":[],"bo":{"exemples":["Il comprend ce que font des assemblages simples de blocs de programmation, par exemple au travers de questions flash.","Il retrouve parmi des programmes donnés celui qui permet d'obtenir une figure donnée, et inversement.","Sans utiliser de langage informatique formalisé, il écrit un algorithme pour décrire un déplacement ou un calcul.","Il décrit ce que fait un assemblage simple de blocs de programmation.","Il ordonne des blocs en fonction d'une consigne donnée.  Assemble correctement les blocs ci-contre pour permettre au lutin de tracer un carré de longueur 100 pixels :","Il produit seul un programme de construction d’un triangle équilatéral, d’un carré ou d’un rectangle en utilisant la boucle :"],"attendu":"Écrire, mettre au point"}}],"automatismes":[{"id":"pm.a1","txt":"Entretenir l’écriture décimale des fractions simples comme 1/2 ; 1/4 ; 3/4 ; 3/2 ; 4/2 ; 5/2 ; 1/10 ; 100/100 ; 7/1.","groupe":"Nombres et calculs"},{"id":"pm.a2","txt":"Comparer des nombres décimaux et calculer avec des nombres décimaux (y compris négatifs)","groupe":"Nombres et calculs"},{"id":"pm.a3","txt":"Simplifier, comparer des fractions, calculer avec des fractions.","groupe":"Nombres et calculs"},{"id":"pm.a4","txt":"Prendre une fraction simple d’un nombre : le tiers de 18 ; le quart de 12. Déterminer a % de c quand a vaut 100, 50, 25, 10, 1.","groupe":"Nombres et calculs"},{"id":"pm.a5","txt":"Écrire un même nombre sous de multiples formes, par exemple dire que 1,2 = 12/10 = 6/5 = 1 +1/5 = 120 % = 120/100 etc.","groupe":"Nombres et calculs"},{"id":"pm.a6","txt":"Passer d’une écriture décimale à la notation scientifique.","groupe":"Nombres et calculs"},{"id":"pm.a7","txt":"Connaitre les carrés des nombres entiers compris entre 1 et 12.","groupe":"Nombres et calculs"},{"id":"pm.a8","txt":"Appliquer les critères de divisibilité par 2, 3, 5, 9.","groupe":"Nombres et calculs"},{"id":"pm.a9","txt":"Pour un nombre entier n, exprimer son double, son triple, sa moitié, son prédécesseur, son successeur, son carré.","groupe":"Nombres et calculs"},{"id":"pm.a10","txt":"Simplifier des expressions littérales.","groupe":"Nombres et calculs"},{"id":"pm.a11","txt":"Calculer la valeur d’une expression algébrique y compris avec des puissances, sans technicité excessive.","groupe":"Nombres et calculs"},{"id":"pm.a12","txt":"Développer et factoriser une expression simple.","groupe":"Nombres et calculs"},{"id":"pm.a13","txt":"Résoudre des équations du type ax = c, x + b = c, ax + b = c.","groupe":"Nombres et calculs"},{"id":"pm.a14","txt":"Sur une droite graduée, lire l’abscisse d’un point et placer un point d’abscisse donnée.","groupe":"Nombres et calculs"},{"id":"pm.a15","txt":"Dans le plan muni d’un repère orthogonal, lire les coordonnées d’un point, placer un point de coordonnées données.","groupe":"Espace et géométrie"},{"id":"pm.a16","txt":"Exploiter le codage d’une figure pour identifier des triangles, des quadrilatères particuliers, une médiatrice.","groupe":"Espace et géométrie"},{"id":"pm.a17","txt":"Reconnaître et citer des angles sur une configuration géométrique. Connaitre angle plat, nul ; angles opposés par le sommet, adjacents, supplémentaires, aigus, obtus. Savoir qu’un angle droit mesure 90°, qu’un angle plat mesure 180 °.","groupe":"Espace et géométrie"},{"id":"pm.a18","txt":"Connaître la somme des mesures des angles d’un triangle, calculer la mesure du troisième angle d’un triangle connaissant les mesures des deux autres.","groupe":"Espace et géométrie"},{"id":"pm.a19","txt":"Connaitre les procédures de conversion d’unités : mm, cm, m, km ; mm2, cm2, m2, km2 ; cm3, dm3, m3 ; g, kg ; mL, cL, dL, L et les correspondances : s, min, h, jour ; dm3, L ; m3, L.","groupe":"Espace et géométrie"},{"id":"pm.a20","txt":"Reconnaître des solides (cube, pavé droit, prisme droit, cylindre, pyramide, cône).","groupe":"Espace et géométrie"},{"id":"pm.a21","txt":"Déterminer le périmètre d’un polygone, d’un disque.","groupe":"Espace et géométrie"},{"id":"pm.a22","txt":"Connaître et utiliser les formules d’aire d’un triangle, d’un rectangle, d’un disque.","groupe":"Espace et géométrie"},{"id":"pm.a23","txt":"Connaître et utiliser les formules du volume d’un cube, d’un pavé droit, d’un prisme droit, d’un cylindre.","groupe":"Espace et géométrie"},{"id":"pm.a24","txt":"Reconnaître une situation d’application du théorème de Pythagore, mettre en place l’automatisme sur l’égalité de Pythagore, développer un regard critique sur les conditions d’utilisation et les résultats obtenus.","groupe":"Espace et géométrie"},{"id":"pm.a25","txt":"Reconnaître une situation d’application du théorème de Thalès dans la configuration des triangles emboîtés, mettre en place l’automatisme sur l’égalité des rapports de longueur, développer un regard critique sur les conditions d’utilisation et les résultats obtenus.","groupe":"Espace et géométrie"},{"id":"pm.a26","txt":"Reconnaître une situation d’application de la ligne trigonométrique cosinus, mettre en place l’automatisme sur l’égalité des rapports de longueur, développer un regard critique sur les conditions d’utilisation et les résultats obtenus.","groupe":"Espace et géométrie"},{"id":"pm.a27","txt":"Mobiliser les propriétés de la symétrie axiale, de la symétrie centrale, de la translation 1.","groupe":"Espace et géométrie"},{"id":"pm.a28","txt":"Attribuer des probabilités dans des cas simples (équiprobabilité).","groupe":"Données et probabilités"},{"id":"pm.a29","txt":"Exprimer une fréquence simple.","groupe":"Données et probabilités"},{"id":"pm.a30","txt":"Exprimer une moyenne.","groupe":"Données et probabilités"},{"id":"pm.a31","txt":"Déterminer une médiane pour une série comportant un petit nombre de valeurs.","groupe":"Données et probabilités"},{"id":"pm.a32","txt":"Lire et interpréter des informations présentées sous forme de tableaux, de diagrammes et de graphiques. 1 La translation ne concerne pas les candidats de l’enseignement agricole","groupe":"Données et probabilités"},{"id":"pm.a33","txt":"Proportionnalité, fonctions","groupe":"Données et probabilités"},{"id":"pm.a34","txt":"Reconnaître si une situation donnée entre dans le cadre de la proportionnalité ou non.","groupe":"Données et probabilités"},{"id":"pm.a35","txt":"Dans des situations simples, mobiliser une procédure adaptée (propriété de linéarité pour la multiplication ou l’addition, retour à l’unité) pour résoudre un problème lié à la proportionnalité.","groupe":"Données et probabilités"},{"id":"pm.a36","txt":"Appliquer une augmentation ou une diminution exprimée en pourcentage.","groupe":"Données et probabilités"},{"id":"pm.a37","txt":"Exploiter un graphique représentant la dépendance de deux grandeurs pour lire et interpréter différentes valeurs sur l’axe des abscisses ou l’axe des ordonnées.","groupe":"Données et probabilités"},{"id":"pm.a38","txt":"Interpréter une suite d’instructions : programme de calcul, déplacement, construction géométrique.","groupe":"Algorithmique et programmation"}],"vocabulaire":[]},{"id":"cap","label":"CAP","niveau":"CAP","voie":"cap","bo":"Programme de mathématiques des classes préparant au CAP (annexe, BO n°30 du 23 juillet 2020)","competences":"pro","chapitres":[{"id":"cap.stat1","domaine":"Statistique – Probabilités","titre":"Statistique à une variable","portee":{},"objectifs":[{"id":"cap.stat1.o1","txt":"Recueillir et organiser des données.","comp":["real"]},{"id":"cap.stat1.o2","txt":"Calculer un effectif total, calculer des fréquences, mentalement dans quelques cas simples, avec une calculatrice ou un tableur dans les autres cas.","comp":["real"]},{"id":"cap.stat1.o3","txt":"Lire et interpréter les données d’une série statistique présentées dans un tableau ou représentées graphiquement, sous forme de classes ou non.","comp":["sapp"]},{"id":"cap.stat1.o4","txt":"Représenter une série statistique par un diagramme en bâtons ou circulaire, sur papier dans quelques cas simples puis à l’aide d’un logiciel.","comp":["real"]},{"id":"cap.stat1.o5","txt":"Calculer la moyenne d’une série statistique mentalement dans quelques cas simples, avec une calculatrice ou un tableur dans les autres cas.","comp":["real"]}],"connaissances":[{"id":"cap.stat1.k1","txt":"Regroupement par classes d’une série statistique.","sous":[]},{"id":"cap.stat1.k2","txt":"Effectifs, fréquences.","sous":[]},{"id":"cap.stat1.k3","txt":"Diagrammes en bâtons, diagrammes circulaires.","sous":[]},{"id":"cap.stat1.k4","txt":"Moyenne.","sous":[]}],"bo":{"objectifs":["Les élèves apprennent à synthétiser l’information et à proposer des représentations pertinentes. Inversement, ils interprètent les informations chiffrées données sous forme de graphiques, de diagrammes en bâtons ou circulaires. Ils découvrent la notion d’intervalle, présentée comme ensemble de nombres vérifiant des inégalités.","Les situations étudiées sont concrètes et comportent des données liées aux spécialités professionnelles ou issues de la vie courante."],"commentaires":["Lorsque les données sont en grand nombre, elles sont systématiquement traitées à l’aide d’un tableur.","Le calcul de la moyenne à l’aide du centre des classes ainsi que la construction et","l’interprétation d’histogrammes ne sont pas des attendus du programme."]}},{"id":"cap.proba","domaine":"Statistique – Probabilités","titre":"Probabilités","portee":{},"objectifs":[{"id":"cap.proba.o1","txt":"Expérimenter pour mettre en évidence la fluctuation des fréquences.","comp":["ana"]},{"id":"cap.proba.o2","txt":"Observer la stabilisation des fréquences, notamment à l’aide d’une simulation informatique fournie.","comp":["real"]},{"id":"cap.proba.o3","txt":"Calculer des probabilités dans des cas simples.","comp":["real"]}],"connaissances":[{"id":"cap.proba.k1","txt":"Expérience aléatoire, ensemble des issues possibles, événement.","sous":[]},{"id":"cap.proba.k2","txt":"Fluctuation d’une fréquence relative à un caractère, sur des échantillons de taille n fixée.","sous":[]},{"id":"cap.proba.k3","txt":"Stabilisation des fréquences vers la probabilité de l'événement lorsque la taille de l’échantillon augmente.","sous":[]},{"id":"cap.proba.k4","txt":"Probabilité d’un événement.","sous":[]},{"id":"cap.proba.k5","txt":"La probabilité d’un événement est comprise entre 0 et 1.","sous":[]},{"id":"cap.proba.k6","txt":"Probabilités d’événements impossibles, certains, contraires.","sous":[]}],"bo":{"objectifs":["Dans ce module, les élèves observent la stabilisation des fréquences vers la probabilité. Ils abordent les questions relatives au hasard et apprennent à calculer des probabilités. On prend appui sur des situations simples, issues de la vie courante ou du domaine professionnel. La compréhension des concepts est facilitée par l’expérimentation physique (jets de dés, lancers de pièces de monnaie…) ou la simulation à l’aide d’un logiciel."],"exemples":["Modifier le script d’un programme fourni pour simuler une expérience aléatoire."],"commentaires":["La mise en évidence de la fluctuation et la vérification de la stabilisation des fréquences s’appuient sur la simulation d’expériences aléatoires à une épreuve, à l’aide d’un script fourni ou d’une feuille de calcul préparée.","L’ensemble des issues est fini. Les calculs de probabilités, à partir de dénombrements, s’appliquent à des contextes simples concernant une expérience aléatoire à une ou deux épreuves indépendantes.","Si des tableaux à double entrée sont utilisés, ils sont fournis aux élèves déjà partiellement complétés.","La construction d’un arbre de dénombrement peut aider à la compréhension de la situation étudiée.","Algèbre – Analyse","Les connaissances de ce domaine ont déjà été abordées au collège et seront réinvesties pour résoudre des problèmes issus des autres disciplines, du secteur professionnel ou de la vie courante.","Ce domaine se compose des modules : Résolution d’un problème relevant de la proportionnalité, Résolution d’un problème du premier degré, Fonctions.","Les possibilités offertes par les outils numériques peuvent aider à surmonter certains obstacles rencontrés par les élèves. L’utilisation du tableur et d’un logiciel de géométrie dynamique, commencée au collège, est renforcée et trouve particulièrement sa place dans certains modules de ce domaine."]}},{"id":"cap.prop","domaine":"Algèbre – Analyse","titre":"Résolution d’un problème relevant de la proportionnalité","portee":{},"objectifs":[{"id":"cap.prop.o1","txt":"Reconnaître que deux suites de nombres sont proportionnelles.","comp":["sapp"]},{"id":"cap.prop.o2","txt":"Calculer une quatrième proportionnelle. Traiter des problèmes relatifs à deux suites proportionnelles de nombres.","comp":["real"]},{"id":"cap.prop.o3","txt":"Étant donné un tableau numérique incomplet lié à deux suites proportionnelles de nombres: trouver le coefficient de proportionnalité permettant de passer d’une suite à l’autre.","comp":["real"]},{"id":"cap.prop.o4","txt":"Étant donné un tableau numérique incomplet lié à deux suites proportionnelles de nombres: compléter le tableau.","comp":["real"]},{"id":"cap.prop.o5","txt":"Traiter des problèmes de pourcentages et d’échelles liés à la vie courante ou professionnelle.","comp":["real"]},{"id":"cap.prop.o6","txt":"Connaissant deux des données suivantes: pourcentage ou échelle, valeur initiale, valeur finale, calculer la troisième.","comp":["real"],"auto":true}],"connaissances":[{"id":"cap.prop.k1","txt":"Proportionnalité","sous":["suites proportionnelles de nombres","coefficient de proportionnalité"]},{"id":"cap.prop.k2","txt":"Pourcentage et échelle. Coefficients multiplicateurs.","sous":[]}],"bo":{"objectifs":["L’objectif de ce module est de consolider l’identification et l’exploitation de situations de proportionnalité. L’utilisation des outils numériques est pertinente pour traiter ce type de situations.","Il est important de présenter des situations de non-proportionnalité."],"exemples":["Calculer une des valeurs connaissant les deux autres parmi : pourcentage ou échelle, valeur initiale, valeur finale."],"commentaires":["Les calculs commerciaux ou financiers peuvent être présentés à titre d’exemple (conversion","des monnaies, indices simples d’un prix). Toutes les informations nécessaires sont fournies."],"bivalence":["La proportionnalité est mise en œuvre dans les domaines Électricité, Mécanique et e système décimal et réciproquement.","groupe":"Tous les CAP"},{"id":"cap.a13","txt":"Carré d’un nombre entier inférieur ou égal à 10, racine carrée d’un carré parfait d’un nombre entier inférieur ou égal à 100.","groupe":"Groupement 1 uniquement"},{"id":"cap.a14","txt":"Conversion des unités de longueurs, d’aires et de volumes.","groupe":"Groupement 1 uniquement"},{"id":"cap.a15","txt":"Mesure de la distance d’un point à une droite.","groupe":"Groupement 1 uniquement"},{"id":"cap.a16","txt":"Mesure de la distance entre deux droites parallèles.","groupe":"Groupement 1 uniquement"},{"id":"cap.a17","txt":"Calcul d’un effectif total, calcul de fréquences, mentalement dans quelques cas simples.","groupe":"Tous les CAP"},{"id":"cap.a18","txt":"Calcul de la moyenne d’une série statistique, mentalement dans quelques cas simples.","groupe":"Tous les CAP"},{"id":"cap.a19","txt":"Calcul d’une quatrième proportionnelle.","groupe":"Tous les CAP"},{"id":"cap.a20","txt":"Détermination d’un coefficient de proportionnalité d’un tableau comportant deux suites de nombres proportionnelles.","groupe":"Tous les CAP"},{"id":"cap.a21","txt":"Calcul d’une des valeurs connaissant les deux autres parmi : pourcentage ou échelle, valeur initiale, valeur finale.","groupe":"Tous les CAP"},{"id":"cap.a22","txt":"Résolution algébrique d’une équation se ramenant à une équation du type ax + b = c, où x est l’inconnue (a, b et c étant des nombres réels, a étant non nul).","groupe":"Tous les CAP"},{"id":"cap.a23","txt":"Placement d’un point connaissant ses coordonnées cartésiennes dans un plan muni d’un repère orthogonal.","groupe":"Tous les CAP"},{"id":"cap.a24","txt":"À partir de la représentation graphique d’une fonction ƒ, sur un intervalle [a ; b] donné, lecture :","groupe":"Tous les CAP"},{"id":"cap.a25","txt":"Construction de la médiatrice d’un segment, d’une parallèle, d’une perpendiculaire à une droite passant par un point, d’un angle de mesure donnée.","groupe":"Groupement 1 uniquement"},{"id":"cap.a26","txt":"Identification dans une figure codée de deux droites perpendiculaires ou parallèles.","groupe":"Groupement 1 uniquement"},{"id":"cap.a27","txt":"Mesure de la longueur d’un segment à l’aide d’un instrument approprié.","groupe":"Groupement 1 uniquement"},{"id":"cap.a28","txt":"Identification d’une figure plane usuelle, d’un solide usuel.","groupe":"Groupement 1 uniquement"}],"vocabulaire":[]},{"id":"bp2","label":"2de Bac Pro","niveau":"2de pro","voie":"pro","bo":"Programme de mathématiques de la classe de seconde professionnelle (annexe, BO spécial n°5 du 11 avril 2019)","competences":"pro","chapitres":[{"id":"bp2.stat1","domaine":"Statistique et probabilités","titre":"Statistique à une variable","portee":{},"objectifs":[{"id":"bp2.stat1.o1","txt":"Recueillir et organiser des données statistiques.","comp":["real"]},{"id":"bp2.stat1.o2","txt":"Organiser des données statistiques en choisissant un mode de représentation adapté à l'aide des fonctions statistiques d'une calculatrice ou d'un tableur.","comp":["real"]},{"id":"bp2.stat1.o3","txt":"Extraire des informations d’une représentation d’une série statistique.","comp":["sapp"]},{"id":"bp2.stat1.o4","txt":"Comparer et interpréter des séries statistiques à l’aide d’indicateurs de position et de dispersion calculés avec les fonctions statistiques d'une calculatrice ou d'un tableur.","comp":["val"]},{"id":"bp2.stat1.o5","txt":"Construire le diagramme en boîte à moustaches associé à une série statistique avec ou sans TIC.","comp":["real"]},{"id":"bp2.stat1.o6","txt":"Comparer et interpréter des diagrammes en boîte à moustaches.","comp":["val"]}],"connaissances":[{"id":"bp2.stat1.k1","txt":"Regroupement par classes d’une série statistique.","sous":[]},{"id":"bp2.stat1.k2","txt":"Représentation d’une série statistique par un diagramme en secteurs, en bâtons, en colonnes, à lignes brisées.","sous":[]},{"id":"bp2.stat1.k3","txt":"Indicateurs de position : mode, classe modale, moyenne, médiane, quartiles.","sous":[]},{"id":"bp2.stat1.k4","txt":"Indicateurs de dispersion : étendue, écart type, écart interquartile Q3 – Q1.","sous":[]},{"id":"bp2.stat1.k5","txt":"Diagrammes en boîte à moustaches.","sous":[]}],"bo":{"objectifs":["L’objectif de ce module est de favoriser la prise d’initiative et la conduite de raisonnements pour interpréter, analyser ou comparer des séries statistiques. Pour ce faire, on s’appuie sur des situations concrètes liées aux spécialités professionnelles ou issues de la vie courante. Des données réelles sont à privilégier. L'utilisation des outils numériques est nécessaire. Ce module est particulièrement propice aux changements de registres (textes, tableaux, graphiques) qui participent au renforcement de la maîtrise de la langue."],"liens":["Au cycle 4, les élèves ont appris à recueillir, organiser, interpréter, représenter et traiter des données, à utiliser un tableur-grapheur pour présenter des données sous la forme d’un tableau ou d’un diagramme. Ils ont également appris à calculer des effectifs et des fréquences, à calculer et à interpréter des indicateurs de position et de dispersion d’une série statistique. Ils ont étudié moyenne, médiane et étendue.","En seconde, ils consolident ces notions et découvrent d’autres représentations et indicateurs permettant de comparer des séries statistiques. Ils découvrent la notion d’intervalle comme ensemble de nombres vérifiant des inégalités."],"exemples":["Déterminer la fréquence d’apparition d’une lettre dans un texte."],"commentaires":["Les déciles et les centiles peuvent être présentés lorsque leur étude est pertinente pour la situation traitée."]}},{"id":"bp2.proba","domaine":"Statistique et probabilités","titre":"Fluctuations d’une fréquence, probabilités","portee":{},"objectifs":[{"id":"bp2.proba.o1","txt":"Expérimenter pour observer la fluctuation des fréquences (jets de dés, lancers de pièces de monnaie…).","comp":["ana"]},{"id":"bp2.proba.o2","txt":"Réaliser une simulation informatique, dans des cas simples, permettant la prise d’échantillons aléatoires de taille n fixée, extraits d’une population où la fréquence p relative à un caractère est connue.","comp":["real"]},{"id":"bp2.proba.o3","txt":"Déterminer l’étendue des fréquences, relatives à un caractère, de la série d’échantillons de taille n obtenus par expérience concrète ou simulation.","comp":["real"]},{"id":"bp2.proba.o4","txt":"Estimer la probabilité d'un événement à partir des fréquences.","comp":["real"]},{"id":"bp2.proba.o5","txt":"Calculer la probabilité d'un événement dans le cas d'une situation aléatoire simple.","comp":["real"]},{"id":"bp2.proba.o6","txt":"Faire preuve d'esprit critique face à une situation aléatoire simple.","comp":["real"]}],"connaissances":[{"id":"bp2.proba.k1","txt":"Vocabulaire des probabilités : expérience aléatoire, ensemble des issues (univers), événement, probabilité.","sous":[]},{"id":"bp2.proba.k2","txt":"Expérience aléatoire à deux issues. Échantillon aléatoire de taille n pour une expérience à deux issues (avec remise).","sous":[]},{"id":"bp2.proba.k3","txt":"Notion de tirage au hasard et avec remise de n éléments dans une population où la fréquence p relative à un caractère est connue.","sous":[]},{"id":"bp2.proba.k4","txt":"Fluctuation d’une fréquence relative à un caractère, sur des échantillons de taille n fixée.","sous":[]},{"id":"bp2.proba.k5","txt":"Stabilisation relative des fréquences vers la probabilité de l'événement quand n augmente.","sous":[]},{"id":"bp2.proba.k6","txt":"Dénombrements à l’aide de tableaux à double entrée ou d’arbres.","sous":[]}],"bo":{"objectifs":["L’objectif de ce module est de formaliser les notions élémentaires de probabilités abordées au cycle 4 et de faire percevoir la loi des grands nombres de manière expérimentale. Il se traite en prenant appui sur des situations concrètes, issues de la vie courante ou du domaine professionnel. La compréhension et l’acquisition des concepts sont facilitées par l’expérimentation réalisée à l’aide de simulations informatiques. L’ensemble des issues est fini."],"liens":["Au cycle 4, les élèves ont découvert le vocabulaire relatif aux probabilités. Ils ont abordé les questions relatives au hasard et sont capables de calculer des probabilités dans des cas simples. Ils ont exprimé des probabilités sous diverses formes (décimale, fractionnaire, pourcentage) et fait le lien entre fréquences et probabilité, en constatant le phénomène de stabilisation des fréquences.","En seconde, les élèves réinvestissent ces notions et découvrent les arbres de dénombrement."],"exemples":["− Modifier une simulation donnée (par exemple, en augmentant la taille de l’échantillon pour percevoir une version vulgarisée de la loi des grands nombres : « Lorsque n est grand, sauf exception, la fréquence observée est proche de la probabilité »).","− Utiliser une simulation fournie pour estimer une probabilité non triviale.","− Écrire des fonctions permettant de simuler une expérience aléatoire, une répétition","d’expériences aléatoires indépendantes."],"commentaires":["− Le vocabulaire des probabilités est présenté en situation.","− Dans le cadre de la programmation, on peut s’intéresser à des exemples pour lesquels l’univers est infini (franc carreau, cible…).","Algèbre – Analyse","Ce domaine permet de former les élèves à la démarche de résolution de problèmes et de les faire progresser dans la maîtrise du calcul numérique et algébrique. Il met en évidence les liens entre les différents registres (numérique, algébrique, graphique) des fonctions utilisées.","Les situations choisies permettent d’approcher les grands débats de société, par exemple autour du développement durable, et de traiter des problématiques parfaitement identifiées. Elles sont, autant que possible, adaptées aux métiers préparés afin de donner du sens aux notions étudiées.","Les objectifs principaux de ce domaine sont :","− modéliser une situation ;","− résoudre des problèmes du premier degré en choisissant une méthode adaptée ;","− découvrir et étudier de nouvelles fonctions.","L’étude des fonctions est facilitée par l’utilisation de tableurs et de logiciels de géométrie dynamique.","L’utilisation des calculatrices et de l’outil informatique pour pallier les difficultés liées aux calculs algébriques, résoudre des équations, inéquations ou systèmes d'équations, construire ou interpréter des courbes, sont des passages obligés de la formation.","La notion d’intervalle, présentée comme ensemble de nombres vérifiant des inégalités, est nouvelle. Elle est introduite lors du module Résolution d’un problème du premier degré ou du module Fonctions."]}},{"id":"bp2.eq1","domaine":"Algèbre – Analyse","titre":"Résolution d’un problème du premier degré","portee":{},"objectifs":[{"id":"bp2.eq1.o1","txt":"Traduire un problème par une équation ou une inéquation du premier degré à une inconnue.","comp":["sapp"]},{"id":"bp2.eq1.o2","txt":"Résoudre algébriquement, graphiquement sans ou avec outils numériques (grapheur, solveur, tableur): une équation du premier degré à une inconnue.","comp":["real"]},{"id":"bp2.eq1.o3","txt":"Résoudre algébriquement, graphiquement sans ou avec outils numériques (grapheur, solveur, tableur): une inéquation du premier degré à une inconnue.","comp":["real"]},{"id":"bp2.eq1.o4","txt":"Choisir et mettre en œuvre une méthode de résolution adaptée au problème.","comp":["ana"]}],"connaissances":[{"id":"bp2.eq1.k1","txt":"Équation du premier degré à une inconnue. Inéquation du premier degré à une inconnue. Intervalles de ℝ.","sous":[]}],"bo":{"objectifs":["L’objectif principal de ce module est de traduire un problème par une équation ou une inéquation du premier degré, de l’étudier et de le résoudre."],"liens":["Au cycle 4, les élèves ont appris à :","− utiliser le calcul littéral ;","− mettre un problème en équation en vue de sa résolution ;","− résoudre algébriquement des équations du premier degré ou s’y ramenant (équations","produits), en particulier des équations du type x2 = a.","En seconde, les élèves approfondissent ces notions. Ils découvrent les inéquations du premier degré à une inconnue. La résolution des équations du type ax = b permet de réinvestir et de consolider le traitement algébrique de problèmes modélisant une situation de proportionnalité."],"exemples":["Formaliser par un organigramme la résolution d’une inéquation du premier degré à une","inconnue du type ax < b."],"commentaires":["Aucune virtuosité calculatoire n’est attendue pour la méthode algébrique."],"bivalence":["Ce module est mis en œuvre dans les domaines Mécanique et Électricité du programme de physique-chimie."]}},{"id":"bp2.fonc","domaine":"Algèbre – Analyse","titre":"Fonctions","portee":{},"objectifs":[{"id":"bp2.fonc.o1","txt":"Exploiter différents modes de représentation d’une fonction et passer de l’un à l’autre (expression, tableau de valeurs, courbe représentative).","comp":["val"]},{"id":"bp2.fonc.o2","txt":"Selon le mode de représentation: identifier la variable.","comp":["real"]},{"id":"bp2.fonc.o3","txt":"Selon le mode de représentation: déterminer l’image ou des antécédents éventuels d’un nombre par une fonction définie sur un ensemble donné.","comp":["real"]},{"id":"bp2.fonc.o4","txt":"Reconnaître une situation de proportionnalité et déterminer la fonction linéaire qui la modélise.","comp":["sapp"]},{"id":"bp2.fonc.o5","txt":"Relier courbe représentative et tableau de variations d’une fonction.","comp":["real"]},{"id":"bp2.fonc.o6","txt":"Déterminer graphiquement les extremums d’une fonction sur un intervalle.","comp":["real"]},{"id":"bp2.fonc.o7","txt":"Exploiter l’équation y = ƒ(x) d’une courbe: vérifier l’appartenance d’un point à une courbe.","comp":["val"]},{"id":"bp2.fonc.o8","txt":"Exploiter l’équation y = ƒ(x) d’une courbe: calculer les coordonnées d’un point de la courbe.","comp":["val"]},{"id":"bp2.fonc.o9","txt":"Représenter graphiquement une fonction affine.","comp":["real"]},{"id":"bp2.fonc.o10","txt":"Déterminer l’expression d’une fonction affine à partir de la donnée de deux nombres et de leurs images.","comp":["real"]},{"id":"bp2.fonc.o11","txt":"Déterminer graphiquement le coefficient directeur d’une droite non verticale.","comp":["real"]},{"id":"bp2.fonc.o12","txt":"Faire le lien entre coefficient directeur et pente dans un repère orthonormé.","comp":["real"]},{"id":"bp2.fonc.o13","txt":"Reconnaître que deux droites d’équations données sont parallèles.","comp":["sapp"]},{"id":"bp2.fonc.o14","txt":"Résoudre graphiquement, ou à l’aide d’outils numériques, un système de deux équations du premier degré à deux inconnues.","comp":["real"]},{"id":"bp2.fonc.o15","txt":"Construire la parabole représentant la fonction carré et donner son tableau de variations.","comp":["real"]},{"id":"bp2.fonc.o16","txt":"Déduire de la courbe représentative d’une fonction ƒ sur un intervalle donné celle de la fonction qui à x associe ƒ(x) + k, où k est un nombre réel donné, sur le même intervalle.","comp":["real"]},{"id":"bp2.fonc.o17","txt":"Déduire de la courbe représentative de la fonction carré, l’allure de celle de la fonction définie par ƒ(x) = kx2, où k est un nombre réel donné.","comp":["real"]},{"id":"bp2.fonc.o18","txt":"Déduire des variations d’une fonction ƒ sur un intervalle donné celles de la fonction kƒ, où k est un nombre réel donné, sur le même intervalle.","comp":["real"]},{"id":"bp2.fonc.o19","txt":"Dans le cadre de problèmes modélisés par des fonctions, résoudre par une méthode algébrique ou graphique une équation du type ƒ(x) = c ou une inéquation du type ƒ(x) < c, où c est un réel donné et ƒ une fonction affine ou une fonction du type x ↦ kx2 (avec k réel donné).","comp":["real"]}],"connaissances":[{"id":"bp2.fonc.k1","txt":"Différents modes de représentation d’une fonction (expression, tableau de valeurs, courbe représentative).","sous":[]},{"id":"bp2.fonc.k2","txt":"Variable, fonction, image, antécédent et notation ƒ(x).","sous":[]},{"id":"bp2.fonc.k3","txt":"Intervalles de ℝ. Fonctions linéaires.","sous":[]},{"id":"bp2.fonc.k4","txt":"Fonction croissante ou décroissante sur un intervalle.","sous":[]},{"id":"bp2.fonc.k5","txt":"Tableau de variations.","sous":[]},{"id":"bp2.fonc.k6","txt":"Maximum, minimum d’une fonction sur un intervalle.","sous":[]},{"id":"bp2.fonc.k7","txt":"Courbe représentative d’une fonction ƒ : la courbe d’équation y = ƒ(x) est l’ensemble des points du plan dont les coordonnées (x;y) vérifient y = ƒ(x).","sous":[]},{"id":"bp2.fonc.k8","txt":"Fonction affine","sous":["courbe représentative","coefficient directeur et ordonnée à l’origine d’une droite représentant une fonction affine","équation réduite d’une droite","sens de variation en fonction du coefficient directeur de la droite qui la représente"]},{"id":"bp2.fonc.k9","txt":"Interprétation du coefficient directeur de la droite représentative d’une fonction affine comme taux d’accroissement.","sous":[]},{"id":"bp2.fonc.k10","txt":"Système de deux équations du premier degré à deux inconnues.","sous":[]},{"id":"bp2.fonc.k11","txt":"Courbe représentative de la fonction carré. Sens de variation de la fonction carré.","sous":[]},{"id":"bp2.fonc.k12","txt":"Résolution algébrique ou graphique.","sous":[]}],"bo":{"objectifs":["Les objectifs de ce module sont :","− consolider et réinvestir les connaissances sur la notion de fonction abordées au collège au travers de situations issues des autres disciplines, de la vie courante ou professionnelle ;","− exploiter différents registres, notamment le registre algébrique, le registre graphique","et le passage de l’un à l’autre ;","− étudier quelques fonctions de référence afin de se constituer un répertoire d’images mentales de leurs courbes représentatives sur lesquelles s’appuyer lors de l’étude de fonctions générées à partir de celles-ci ;","− introduire l’étude des variations d’une fonction et les notions liées aux extremums ;","− modéliser des problèmes issus de situations concrètes à l’aide de fonctions afin de","les résoudre.","Le vocabulaire élémentaire sur les fonctions est abordé en situation. Les fonctions définies sur un intervalle de ℝ permettent de modéliser des phénomènes continus. On ne se limite pas aux intervalles du type [a ; b], avec a et b réels ; en fonction des situations étudiées, les élèves peuvent être confrontés à d’autres types d’intervalles (]a ; b[, [a ; b[, ]a ; b], avec a et b réels). Les modèles mathématiques obtenus peuvent conduire à l’étude de fonctions sur ℝ. On peut également confronter les élèves à des exemples de fonctions définies sur ℕ pour modéliser des phénomènes discrets. Pour la modélisation de phénomènes physiques, le nom de la variable peut être choisi en cohérence avec la situation, par exemple la variable t pour le temps.","Les outils numériques (logiciel de géométrie dynamique, calculatrice, tableur ou logiciel de programmation) sont mis à profit pour obtenir la courbe représentative d’une fonction et pour établir un tableau de valeurs."],"liens":["Au cycle 4, les élèves ont appris à :","− manipuler la notion de fonction ;","− passer d’un mode de représentation d’une fonction à un autre ;","− déterminer, à partir d’un mode de représentation, l’image ou un antécédent d’un","nombre par une fonction ;","− représenter graphiquement une fonction linéaire, une fonction affine ;","− modéliser une situation de proportionnalité à l’aide d’une fonction linéaire ;","− modéliser un phénomène continu par une fonction ;","− résoudre des problèmes modélisés par des fonctions ;","− résoudre algébriquement des équations du premier degré ou s’y ramenant (équations","produits), en particulier des équations du type x2 = a.","En seconde, les élèves consolident les notions de fonction, de variable et découvrent la","notion d’équation d’une courbe représentative d’une fonction.","À partir de la courbe représentative d’une fonction ƒ, ils apprennent à établir un tableau de variations d’une fonction et à obtenir la courbe représentative de la fonction qui à x associe ƒ(x) + k, où k est un réel donné.","Ils découvrent la fonction carré comme nouvelle fonction de référence et déduisent de sa courbe représentative, l’allure de celle de la fonction qui à x associe kx2, où k est un réel donné.","Ils déduisent, des variations d’une fonction ƒ, celles de la fonction kƒ, où k est un réel donné.","Ils apprennent à résoudre des équations du type ƒ(x) = c, ou des inéquations du type","ƒ(x) < c, où c est un réel donné.","Les systèmes de deux équations du premier degré à deux inconnues sont introduits dans ce module. Leur résolution se fait graphiquement, à l’aide d’outils numériques."],"exemples":["− Traduire un programme de calcul à l’aide d’une fonction en Python.","− Calculer les images de nombres par une fonction.","− Déterminer l’équation réduite d’une droite non parallèle à l’axe des ordonnées.","− Rechercher un extremum par balayage sur un intervalle donné.","− Rechercher un encadrement ou une valeur approchée d’une solution d’une équation","du type ƒ(x) = 0 par balayage sur un intervalle donné."],"commentaires":["− Lors de la détermination de l’expression d’une fonction affine à partir de la donnée de deux nombres et de leurs images, on se limite à des cas simples, ne conduisant à aucune difficulté calculatoire.","− Les fonctions sont définies et étudiées sur un intervalle de ℝ.","− Les fonctions cube, racine carrée, inverse ou trigonométriques peuvent être évoquées lors de la résolution de problèmes en lien avec le domaine professionnel.","− Les droites d’équation x = a ne sont pas un attendu du programme."],"bivalence":["− Ce module est mis en œuvre dans les domaines Chimie, Thermique, Mécanique,","Électricité et Optique du programme de physique-chimie."]}},{"id":"bp2.calc","domaine":"Algèbre – Analyse","titre":"Calculs commerciaux et financiers","portee":{"sans_pc":true},"objectifs":[{"id":"bp2.calc.o1","txt":"Compléter une facture, un bon de commande, réaliser un devis en déterminant dans le cadre de situations professionnelles: un prix.","comp":["real"]},{"id":"bp2.calc.o2","txt":"Compléter une facture, un bon de commande, réaliser un devis en déterminant dans le cadre de situations professionnelles: un coût.","comp":["real"]},{"id":"bp2.calc.o3","txt":"Compléter une facture, un bon de commande, réaliser un devis en déterminant dans le cadre de situations professionnelles: une marge.","comp":["real"]},{"id":"bp2.calc.o4","txt":"Compléter une facture, un bon de commande, réaliser un devis en déterminant dans le cadre de situations professionnelles: une taxe.","comp":["real"]},{"id":"bp2.calc.o5","txt":"Compléter une facture, un bon de commande, réaliser un devis en déterminant dans le cadre de situations professionnelles: une réduction commerciale (remise, rabais, ristourne).","comp":["real"]},{"id":"bp2.calc.o6","txt":"Compléter une facture, un bon de commande, réaliser un devis en déterminant dans le cadre de situations professionnelles: un taux.","comp":["real"]},{"id":"bp2.calc.o7","txt":"Calculer le montant: d’un intérêt simple.","comp":["real"]},{"id":"bp2.calc.o8","txt":"Calculer le montant: d’une valeur acquise.","comp":["real"]},{"id":"bp2.calc.o9","txt":"Déterminer graphiquement ou par le calcul: un taux annuel de placement.","comp":["real"]},{"id":"bp2.calc.o10","txt":"Déterminer graphiquement ou par le calcul: la durée de placement (exprimée en jours, quinzaines, mois ou années).","comp":["real"]},{"id":"bp2.calc.o11","txt":"Déterminer graphiquement ou par le calcul: le montant du capital placé.","comp":["real"]}],"connaissances":[{"id":"bp2.calc.k1","txt":"Pourcentages.","sous":[]},{"id":"bp2.calc.k2","txt":"Coefficients multiplicateurs.","sous":[]},{"id":"bp2.calc.k3","txt":"Capital, taux, intérêt, valeur acquise.","sous":[]}],"bo":{"objectifs":["Ce module permet de renforcer la maîtrise des pourcentages communément utilisés dans les organisations (entreprises commerciales, associations, établissements publics) lors de l’établissement ou de l’utilisation de divers documents (factures, bulletins de paye, documents financiers…). Ce module se prête à des séances de co-intervention, par exemple lors de l’utilisation de logiciels métiers."],"exemples":["− Calculer le montant d’un intérêt simple.","− Calculer le montant net à payer après une remise pour une facture."],"commentaires":["− Si une situation contextualisée utilise un vocabulaire ou une formule spécifique, ce vocabulaire sera explicité et les différents éléments permettant les calculs seront donnés.","− Retrouver le montant du capital placé à partir de la valeur acquise, du taux annuel et","de la durée de placement n’est pas un attendu de certification.","− Grandeurs proportionnelles : les partages proportionnels peuvent être traités s’ils sont","en liaison directe avec l’enseignement professionnel et s’ils lui sont utiles."]}},{"id":"bp2.geo","domaine":"Géométrie","titre":"Géométrie plane et dans l’espace","portee":{},"objectifs":[{"id":"bp2.geo.o1","txt":"Reconnaître, nommer un solide usuel. Nommer les solides usuels constituant d'autres solides.","comp":["sapp"]},{"id":"bp2.geo.o2","txt":"Calculer des longueurs, des mesures d’angles, des aires et des volumes dans les figures ou solides (les formules pour la pyramide, le cône et la boule sont fournies).","comp":["real"]},{"id":"bp2.geo.o3","txt":"Déterminer les effets d’un agrandissement ou d’une réduction sur les longueurs, les aires et les volumes.","comp":["real"]}],"connaissances":[{"id":"bp2.geo.k1","txt":"Solides usuels : le cube, le pavé droit, la pyramide, le cylindre droit, le cône, la boule.","sous":[]},{"id":"bp2.geo.k2","txt":"Figures planes usuelles : triangle, quadrilatère, cercle.","sous":[]},{"id":"bp2.geo.k3","txt":"Le théorème de Pythagore et sa réciproque. Le théorème de Thalès dans le triangle.","sous":[]},{"id":"bp2.geo.k4","txt":"Formule donnant le périmètre d’un cercle.","sous":[]},{"id":"bp2.geo.k5","txt":"Somme des mesures, en degré, des angles d’un triangle.","sous":[]},{"id":"bp2.geo.k6","txt":"Formule de l’aire d’un triangle, d’un carré, d'un rectangle, d’un disque.","sous":[]},{"id":"bp2.geo.k7","txt":"Formule du volume du cube, du pavé droit et du cylindre.","sous":[]},{"id":"bp2.geo.k8","txt":"Grandeurs proportionnelles.","sous":[]}],"bo":{"liens":["Au cycle 4, les élèves ont appris à :","− calculer avec des grandeurs mesurables ; exprimer les résultats dans les unités adaptées ;","− mobiliser les connaissances des figures, des configurations au programme pour déterminer des grandeurs géométriques ;","− utiliser un logiciel de géométrie dynamique pour représenter des figures ou des solides.","En seconde, ce module permet de consolider et d’approfondir les capacités et connaissances travaillées au cycle 4."],"exemples":["− Chercher les triplets d’entiers pythagoriciens jusqu’à 1 000.","− Calculer des aires ou des volumes.","− Calculer le diamètre d’un cylindre connaissant sa hauteur et son volume.","− Calculer l’aire d’un carré de périmètre connu.","− Construire une figure géométrique."],"commentaires":["− L’étude du théorème de Pythagore et de sa réciproque permet de travailler les","raisonnements logiques.","− Formaliser par un organigramme la réciproque du théorème de Pythagore est envisageable, mais la prise en compte des nombres flottants complique la programmation si les nombres ne sont pas entiers.","− La proportionnalité peut être réinvestie dans ce domaine, par exemple pour calculer la longueur d’un arc de cercle."],"bivalence":["Ce module est mis en œuvre dans les domaines Mécanique et Optique du programme de physique-chimie."]}},{"id":"bp2.algo","domaine":"Algorithmique et programmation","titre":"Algorithmique et programmation","portee":{},"objectifs":[{"id":"bp2.algo.o1","txt":"Analyser un problème.","comp":["ana"]},{"id":"bp2.algo.o2","txt":"Décomposer un problème en sous- problèmes.","comp":["ana"]},{"id":"bp2.algo.o3","txt":"Repérer les enchaînements logiques et les traduire en instructions conditionnelles et en boucles.","comp":["sapp"]},{"id":"b
